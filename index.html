<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Atom-Feed «geänderte Erlasse» (QS-VERWENDEN V5) — Generator:
         scripts/feed-generieren.ts, npm run gen:feed. -->
    <link rel="alternate" type="application/atom+xml" title="LexMetrik — geänderte Erlasse" href="/feed/erlasse.xml" />
    <!-- title/description/og/twitter sind Projektionen von src/lib/seo.ts
         (SITE_TITEL/SITE_DESCRIPTION/SITE_OG_DESCRIPTION). Parität erzwingt das
         Tor check:seo-index — hier nie von Hand abweichen, sondern seo.ts pflegen. -->
    <title>LexMetrik — Schweizer Gesetze, Rechtsprechung, Materialien, Rechner</title>
    <meta name="description" content="Gesetze von Bund und Kantonen, Bundesgerichtsentscheide und amtliche Materialien der Schweiz, mit Stand und Link zur amtlichen Quelle. Dazu Rechner und Vorlagen." />
    <!-- theme-color ist eine Projektion von --paper (src/index.css): der
         Browser-Rahmen trägt exakt die Seitenfläche. Parität erzwingt
         check:design-tokens Prüfung 4 — hier nie von Hand abweichen. -->
    <meta name="theme-color" content="#FDFCFA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1B1917" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LexMetrik" />
    <meta property="og:title" content="LexMetrik — Schweizer Gesetze, Rechtsprechung, Materialien, Rechner" />
    <meta property="og:description" content="Gesetze von Bund und Kantonen, Bundesgerichtsentscheide und amtliche Materialien der Schweiz, dazu Rechner und Vorlagen. Gerechnet wird nach festen Regeln, mit Norm, Link und Stand." />
    <meta property="og:url" content="https://lexmetrik.vercel.app/" />
    <meta property="og:locale" content="de_CH" />
    <!-- Statische Social-Card (W1.10): absolute URL wie og:url; bei Domainwechsel
         (W3.4) mit SITE_URL/og:url zusammen umziehen. Generator: scripts/og-bild.ts. -->
    <meta property="og:image" content="https://lexmetrik.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="LexMetrik — Schweizer Gesetze, Rechtsprechung, Materialien, Rechner" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://lexmetrik.vercel.app/og.png" />
    <meta name="twitter:title" content="LexMetrik — Schweizer Gesetze, Rechtsprechung, Materialien, Rechner" />
    <meta name="twitter:description" content="Gesetze von Bund und Kantonen, Bundesgerichtsentscheide und amtliche Materialien der Schweiz, dazu Rechner und Vorlagen. Gerechnet wird nach festen Regeln, mit Norm, Link und Stand." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
