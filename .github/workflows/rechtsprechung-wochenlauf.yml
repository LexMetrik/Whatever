# ─── Rechtsprechungs-Wochenlauf (QS-KORPUS) ─────────────────────────────────
# Montags: neue BGE (laufender + Vorjahresband), BS-Delta, übrige Gerichte
# additiv, dann Remap/Projektionen/Tore und eine automatische Identitäts-
# Stichprobe. Ergebnis: EIN PR mit Bericht — oder keiner, wenn nichts Neues kam.
# Logik: scripts/rechtsprechung/wochenlauf.ts (+ -kern.ts, getestet).
#
# KEIN AUTO-MERGE (Entscheid David 25.9.2026: «Vorbereiten, Prüfung vor Live»).
# Das Rahmen-Gate «Ja, voll freigeben» (16.7.2026) gilt nur für
# fedlex-frische.yml. Der PR trägt «Gegenpruefung: ausstehend» — formal
# untauglich, check:merge-schutz bleibt rot, bis eine Session prüft
# (Skill korpus-werkstatt, «Wochen-Nachzug prüfen und landen»).
# Rotes Tor oder Fehltreffer der Stichprobe ⇒ PR als ENTWURF, Befund im Body.
name: Rechtsprechung-Wochenlauf

on:
  schedule:
    - cron: '37 5 * * 1' # montags 05:37 UTC: nach fedlex-frische (04:43), vor normen-monitor (07:17)
  workflow_dispatch:

concurrency:
  group: rechtsprechung-wochenlauf
  cancel-in-progress: false

jobs:
  wochenlauf:
    name: Entscheide nachziehen · Bericht · PR
    runs-on: ubuntu-latest
    # BS-Delta holt je Woche wenige hundert Dokumente, BGE-Bänder brauchen clir
    # je neuem Entscheid; dazu 7 Tore. Grosszügig, weil ein Abbruch alles verwirft.
    timeout-minutes: 150
    env:
      TZ: Europe/Zurich # wie ci.yml/fedlex-frische.yml
    permissions:
      contents: write
      pull-requests: write
      actions: write # CI-Dispatch, falls kein AUTOMERGE_TOKEN greift (s. fedlex-frische.yml K1)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npx -y npm@11 ci

      - name: Laufdatum festlegen (§2 — kein Date.now in der Erhebung)
        id: datum
        run: echo "iso=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Wochenlauf (Quellen · Nachbau · Tore · Stichprobe)
        id: lauf
        # --checkpoint: WIP-Commit je Quelle, Rücksetzen bei Exit ≠ 0 — ein
        # Quellen-Ausfall bricht die anderen nicht ab (Kopf wochenlauf.ts).
        run: |
          git config user.name  "rechtsprechung-wochenlauf-bot"
          git config user.email "noreply@anthropic.com"
          npx vite-node scripts/rechtsprechung/wochenlauf.ts -- \
            --datum=${{ steps.datum.outputs.iso }} --aus="$RUNNER_TEMP/wochenlauf" --checkpoint

      - name: Job-Summary
        if: always()
        run: cat "$RUNNER_TEMP/wochenlauf/summary.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "Kein Bericht — Lauf abgestürzt, siehe Log." >> "$GITHUB_STEP_SUMMARY"

      - name: PR eröffnen oder aktualisieren (NIE Auto-Merge)
        if: steps.lauf.outputs.entscheid == 'pr' || steps.lauf.outputs.entscheid == 'entwurf'
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
          HAT_PAT: ${{ secrets.AUTOMERGE_TOKEN != '' }}
          DATUM: ${{ steps.datum.outputs.iso }}
          ENTSCHEID: ${{ steps.lauf.outputs.entscheid }}
          AUS: ${{ runner.temp }}/wochenlauf
        run: |
          set -euo pipefail
          titel="feat(rechtsprechung): Wochen-Nachzug ${DATUM} (QS-KORPUS)"
          # Ein offener Auto-PR wird aktualisiert, nicht dupliziert. Er baut
          # ohnehin auf main auf, trägt also den Stand der Vorwoche mit.
          branch=$(gh pr list --state open --json headRefName \
            --jq '[.[].headRefName | select(startswith("auto/rechtsprechung-"))][0] // empty')
          nr=""
          if [ -n "$branch" ]; then
            nr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
            # Nie überschreiben, woran eine Session schon arbeitet: fremde
            # Commits auf dem Zweig oder ein eingesetztes Verdikt im Body.
            git fetch -q origin "$branch"
            autor=$(git log -1 --format=%an "origin/$branch")
            body=$(gh pr view "$nr" --json body --jq .body)
            if [ "$autor" != "rechtsprechung-wochenlauf-bot" ] || \
               grep -qE '^Gegenpruefung: (bestanden|behoben)' <<< "$body"; then
              echo "::warning::PR #${nr} ist in Prüfung (Autor ${autor} bzw. Verdikt gesetzt) — nicht überschrieben; Nachzug nächste Woche."
              echo "**PR #${nr} in Prüfung — nicht überschrieben.**" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          else
            branch="auto/rechtsprechung-${DATUM}"
          fi
          git checkout -q -B "$branch"
          git add -A
          git commit -q -F "$AUS/commit.txt"
          git push -q --force origin "$branch"
          if [ -n "$nr" ]; then
            gh pr edit "$nr" --title "$titel" --body-file "$AUS/bericht.md"
          else
            entwurf=""; [ "$ENTSCHEID" = "entwurf" ] && entwurf="--draft"
            gh pr create --base main --head "$branch" $entwurf --title "$titel" --body-file "$AUS/bericht.md"
            nr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
          fi
          # Entwurf-Status dem Befund dieser Woche angleichen (beide Richtungen).
          if [ "$ENTSCHEID" = "entwurf" ]; then gh pr ready "$nr" --undo || true; else gh pr ready "$nr" || true; fi
          # github.token löst keine Workflows aus (Rekursionssperre) — dann CI
          # per workflow_dispatch anstossen; mit PAT lief sie schon durch den Push.
          if [ "$HAT_PAT" != "true" ]; then
            gh workflow run ci.yml --ref "$branch" || echo "::warning::ci.yml-Dispatch fehlgeschlagen — der Wächter zieht nach."
          fi
          echo "PR #${nr} (${ENTSCHEID}) auf ${branch}." >> "$GITHUB_STEP_SUMMARY"
