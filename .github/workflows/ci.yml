# Anlass/Belege: archiv/ci-yml-kommentare.md#ci-001
name: CI

on:
  push:
    branches: [main]
  # BEWUSST OHNE paths/paths-ignore — siehe K3/K12 im Kopf.
  pull_request:
  # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-002
  merge_group:
  workflow_dispatch:
    inputs:
      probe:
        description: 'Rot-Beweis (§6.7): «ohne-token» faehrt den Deploy-Job mit LEEREM VERCEL_TOKEN — er muss rot werden und darf nichts ausliefern. Leer lassen = normaler Volllauf, kein Deploy.'
        required: false
        default: ''
        type: string

concurrency:
  group: ci-${{ github.ref }}
  # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-003
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-004
  diff:
    name: Diff-Klassierung (Code vs. Code-fern vs. Doku)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-005
      actions: read
    outputs:
      art: ${{ steps.klassieren.outputs.art }}
      push_diaet: ${{ steps.diaet.outputs.push_diaet }}
      bau_perf_belegt: ${{ steps.diaet.outputs.bau_perf_belegt }}
    steps:
      - name: PR-Diff klassieren
        id: klassieren
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          GEMELDET: ${{ github.event.pull_request.changed_files }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
          MG_BASE_REF: ${{ github.event.merge_group.base_ref }}
        run: |
          set -euo pipefail
          # Flächen, die die ausgelieferte App nachweislich nicht berühren
          # (Klasse `code-fern`, Punkt 3 QS-PLAN-EINFACH 14.8.2026 — 78 %-
          # Messwert der Browser-Shards). Für PUSH und PULL_REQUEST gemeinsam
          # definiert, damit beide Zweige exakt dieselbe Regel auswerten (§5).
          # KONSERVATIV: jede andere Datei (auch package.json, e2e/**,
          # scripts/** sonst) kippt auf `art=code` (§6.7-Fehlerseite).
          #
          # Direkt in Bash, NICHT nach `scripts/ci/diff-klassieren.ts`
          # ausgelagert: dieser `diff`-Job ist bewusst checkout-/npm-frei
          # ("billigster Job der Kette", siehe Kommentar unten) — ein
          # `vite-node`-Aufruf bräuchte Checkout + `npx -y npm@11 ci` bei JEDEM Lauf,
          # nicht nur bei code-fernen. Dieselbe Regel liegt zusätzlich als
          # reine, Vitest-getestete Funktion in scripts/ci/diff-klassieren.ts
          # (§6.7-Beweis dort, `npx vitest run src/tests/steuerwerkzeuge.
          # test.ts`) — die Pfadliste hier ist wortgleich zu deren
          # CODE_FERNE_MUSTER, damit beide Fassungen nicht auseinanderlaufen.
          CODE_FERN_RE='(\.md$|^scripts/plan/|^scripts/cowork/|^\.claude/|^docs/|^bibliothek/|^messwerte/|^archiv/)'
          # Trotz `.md`-Endung KEIN reiner Doku-Fall (Anlass PR #619, 2.9.2026):
          # .claude/agents/lex-bau.md wurde von Hand geändert, der reine-.md-
          # Kurzschluss unten stufte den Diff als `doku` ein, der Tore-Job
          # (check:dispatch-klausel) lief nicht (§6.7). Wortgleich zu
          # WERKZEUG_TROTZ_MD_MUSTER in scripts/ci/diff-klassieren.ts.
          WERKZEUG_TROTZ_MD_RE='(^\.claude/agents/|^docs/token-oekonomie/dispatch-template\.md$)'
          # UMBENENNUNGEN (Auflage Gegenprüfung 19.9.2026): Compare- und
          # PR-Files-API melden bei `status: renamed` in `.filename` nur den
          # NEUEN Pfad; der alte steht in `.previous_filename`. Ohne ihn wäre
          # `src/lib/x.ts` → `docs/x.md` «rein .md» ⇒ `doku` — eine App-Datei
          # verschwände ungeprüft. Alle drei Zweige klassieren darum BEIDE
          # Pfade. Gezählt (changed_files-Abgleich, Kappungsgrenze 300) werden
          # weiterhin nur die Einträge: Zeilen «N|<neu>» zählen, Zeilen
          # «A|<alt>» fliessen nur in die Klassierung.
          DATEI_JQ='"N|\(.filename)", (.previous_filename // empty | "A|\(.)")'
          # `workflow_dispatch` (und jedes unbekannte Event) fährt unverändert
          # das volle Programm: ein Handstart ist immer als Volllauf gemeint.
          if [ "$EVENT" != "pull_request" ] && [ "$EVENT" != "push" ] && [ "$EVENT" != "merge_group" ]; then
            echo "art=code" >> "$GITHUB_OUTPUT"
            echo "Event '${EVENT}' — keine Klassierung, volles Programm."
            exit 0
          fi
          # ── merge_group (Merge-Queue auf main, QS-ORG-UMZUG 19.9.2026) ───────
          # BIS 19.9.2026 fuhr jeder Queue-Eintrag pauschal `art=code`. Seit
          # Davids Entscheid «alles durch die warteschlange» (19.9.2026) gibt
          # es keine Direkt-Pushes mehr — auch jede Roadmap-Zeile läuft als PR
          # durch die Queue und hätte dort Tore + Bau + 4 Playwright-Shards
          # gebrannt (~70 Runner-Minuten, flake-anfällig). Klassiert wird
          # darum der Diff DIESES Queue-Eintrags: `base_sha`...`head_sha` des
          # Events, über die Compare-API (kein Checkout, wie im push-Zweig).
          #
          # STAPELUNG: `base_sha` ist der Eltern-Commit der Merge-Gruppe — bei
          # gestapelten Einträgen also der Queue-Commit des VORDERMANNS, nicht
          # main (gemessen 19.9.2026: Zweig `gh-readonly-queue/main/pr-917-
          # 06489b10c…` trägt den Vordermann-SHA im Namen, und 9b125ce8e hat
          # 06489b10c als einzigen Elter). Das ist richtig so: der Vordermann
          # hat seinen EIGENEN merge_group-Lauf auf seinem eigenen Diff. Fliegt
          # er raus, baut GitHub die Nachfolger neu — neuer Zweig, neuer
          # head_sha, neues `merge_group`-Ereignis, neuer Lauf mit neuer
          # Klassierung (docs.github.com «Managing a merge queue», Abruf
          # 19.9.2026: «the merge queue automatically removes pull request #1
          # from the merge queue. The merge queue recreates the temporary
          # branch with the prefix of main/pr-2 to only contain changes from
          # the target branch and pull request #2.»). Ein Lauf, der gegen
          # einen verworfenen Vordermann klassiert hat, landet also nie.
          #
          # AUFLAGE, HART GEPRÜFT: Die Klassierung je Eintrag trägt NUR unter
          # der Gruppierung ALLGREEN («All pull requests must satisfy required
          # checks to be merged», ebd.). Unter HEADGREEN genügt der grüne
          # KOPF der Gruppe — ein Doku-Eintrag am Kopf (leichtes Programm)
          # würde dann einen roten Code-Vordermann mit durchwinken. Die
          # Strategie wird darum bei JEDEM Lauf aus den aktiven Regeln des
          # Ziel-Branches gelesen (`rules/branches/<branch>`, ohne Admin-Recht
          # lesbar — gemessen 19.9.2026 sogar unauthentifiziert); alles ausser
          # genau `ALLGREEN` ⇒ `code`.
          #
          # FEHLERSEITE (§6.7) — jeder dieser Fälle fällt auf `code`:
          #   · base_sha/head_sha/base_ref fehlen im Ereignis
          #   · Regeln nicht lesbar oder Strategie ≠ ALLGREEN
          #   · Compare-API antwortet nicht, oder der Bereich ist nicht rein
          #     «ahead» (base kein Vorfahre von head ⇒ die Drei-Punkt-Compare
          #     rechnete gegen eine merge-base und könnte Dateien verschweigen)
          #   · 0 Dateien oder 300 (Kappungsgrenze der API, wie im push-Zweig)
          # Der DEPLOY bleibt davon unberührt: über Bau + Deploy entscheidet
          # weiterhin allein der push-Zweig unten (Basis = live ausgelieferter
          # Stand), nie diese Klassierung.
          if [ "$EVENT" = "merge_group" ]; then
            if [ -z "${MG_BASE:-}" ] || [ -z "${MG_HEAD:-}" ] || [ -z "${MG_BASE_REF:-}" ]; then
              echo "art=code" >> "$GITHUB_OUTPUT"
              echo "::warning::merge_group ohne base_sha/head_sha/base_ref — volles Programm."
              exit 0
            fi
            STRATEGIE=$(gh api "repos/${REPO}/rules/branches/${MG_BASE_REF#refs/heads/}" --jq '[.[] | select(.type == "merge_queue") | .parameters.grouping_strategy] | unique | join(",")' || true)
            if [ "$STRATEGIE" != "ALLGREEN" ]; then
              echo "art=code" >> "$GITHUB_OUTPUT"
              echo "::warning::Merge-Queue-Gruppierung '${STRATEGIE:-<nicht lesbar>}' statt ALLGREEN — Klassierung je Eintrag trägt nicht, volles Programm."
              exit 0
            fi
            if ! gh api "repos/${REPO}/compare/${MG_BASE}...${MG_HEAD}" --jq '"\(.status)|\(.behind_by)", (.files[]? | '"${DATEI_JQ}"')' > mg-antwort.txt; then
              echo "art=code" >> "$GITHUB_OUTPUT"
              echo "::warning::Compare-API ${MG_BASE}...${MG_HEAD} nicht auswertbar — volles Programm."
              exit 0
            fi
            lage=$(sed -n '1p' mg-antwort.txt)
            sed '1d' mg-antwort.txt > mg-roh.txt
            sed 's/^[NA]|//' mg-roh.txt > mg-dateien.txt
            if [ "$lage" != "ahead|0" ]; then
              echo "art=code" >> "$GITHUB_OUTPUT"
              echo "::warning::Bereich ${MG_BASE}...${MG_HEAD} ist '${lage}' statt 'ahead|0' (base kein Vorfahre von head) — volles Programm."
              exit 0
            fi
            anzahl=$(grep -c '^N|' mg-roh.txt || true)
            echo "Queue-Eintrag ${MG_BASE}...${MG_HEAD}: ${anzahl} Datei(en)."
            if [ "$anzahl" -eq 0 ] || [ "$anzahl" -ge 300 ]; then
              echo "art=code" >> "$GITHUB_OUTPUT"
              echo "Dateizahl ${anzahl} (leer oder an der API-Kappungsgrenze 300) — volles Programm."
              exit 0
            fi
            # Dieselbe Drei-Klassen-Regel wie im push- und pull_request-Zweig
            # (CODE_FERN_RE/WERKZEUG_TROTZ_MD_RE oben; Modell und §6.7-Beweis:
            # klassifiziereDiff in scripts/ci/diff-klassieren.ts).
            if grep -qvE '\.md$' mg-dateien.txt || grep -qE "$WERKZEUG_TROTZ_MD_RE" mg-dateien.txt; then
              if grep -qvE "$CODE_FERN_RE" mg-dateien.txt; then
                echo "art=code" >> "$GITHUB_OUTPUT"
                echo "App-nahe Dateien im Queue-Eintrag — volles Programm:"
                grep -vE "$CODE_FERN_RE" -m 20 mg-dateien.txt
              else
                echo "art=code-fern" >> "$GITHUB_OUTPUT"
                echo "Nur app-ferne Nicht-Doku-Dateien im Queue-Eintrag (${anzahl} Datei(en)) — Bau + alle Node-Tore laufen VOLL, nur die 8 Browser-Shards werden übersprungen; Perf-Budget meldet 'skipped'."
              fi
            else
              echo "art=doku" >> "$GITHUB_OUTPUT"
              echo "Reiner Doku-Queue-Eintrag (${anzahl} Datei(en)) — Merge-Schutz, Fachänderungs-Riegel, check:plan, check:steuerdeckel, check:steuerflaeche und check:bibliothek laufen ECHT, restliche Code-Tore quittieren; Perf-Budget meldet 'skipped'."
            fi
            exit 0
          fi
          # ── push auf main (Freigabe David 14.8.2026, Kopf dieser Datei) ──────
          # Dateiliste über die Compare-API statt `git diff`: der Job hat bewusst
          # keinen Checkout (billigster Job der Kette), und ein `fetch-depth: 0`
          # nur zum Zählen wäre teurer als der API-Aufruf.
          # FEHLERSEITE (§6.7) — jeder dieser Fälle fällt auf `code`:
          #   · erster Push eines Branches / kein Vorgänger (BEFORE = 40 Nullen)
          #   · Force-Push oder verworfene Historie (Compare-API antwortet nicht)
          #   · 300 Dateien in der Antwort: das ist die Kappungsgrenze der API —
          #     dahinter könnte eine Nicht-Doku-Datei stehen, die wir nie sehen
          #   · leerer Bereich: auf einem Deploy-Stand kein belegter Normalfall
          if [ "$EVENT" = "push" ]; then
            if [ -z "${BEFORE:-}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
              echo "art=code" >> "$GITHUB_OUTPUT"
              echo "Kein Vorgänger-Commit (BEFORE='${BEFORE:-}') — volles Programm."
              exit 0
            fi
            # ── Basis = LIVE ausgelieferter Stand, nicht der Push-Vorgänger ──
            # Wurzel-Fix 30.8.2026 (Vorfall Prod-Smoke 29./30.8., Issue #579):
            # der CI-Lauf eines gemergten Code-PRs wurde in der WARTESCHLANGE
            # vom nächsten Doku-Push verdrängt (GitHub ersetzt wartende Läufe
            # derselben Concurrency-Gruppe); der Doku-Lauf klassierte nur
            # SEINEN Diff (BEFORE...AFTER) und übersprang Bau + Deploy — der
            # Code-Commit blieb ~21 h unausgeliefert, bis der Smoke Alarm
            # schlug. Die Klassierungs-Basis ist darum der Stand, der WIRKLICH
            # live ist (<meta name="lexmetrik-build"> der Startseite — dieselbe
            # Quelle wie pruefeBuildStand in scripts/betrieb/prod-smoke.ts).
            # Nicht lesbar/leer ⇒ Rückfall auf BEFORE (Warnzeile); jeder
            # Compare-Fehler auf der Live-Basis fällt wie bisher auf `code`
            # (§6.7-Fehlerseite = Volllauf inkl. Deploy).
            LIVE=$(curl -fsS --max-time 15 https://lexmetrik.vercel.app/ | grep -oE 'name="lexmetrik-build" content="[0-9a-f]{40}"' | grep -oE '[0-9a-f]{40}' | head -1 || true)
            if [ -n "$LIVE" ] && [ "$LIVE" != "$BEFORE" ]; then
              echo "Diff-Basis = Live-Build ${LIVE} (statt BEFORE ${BEFORE}) — ungelieferte Commits zählen mit."
              BEFORE="$LIVE"
            elif [ -z "$LIVE" ]; then
              echo "::warning::Live-Build-Kennung nicht lesbar — Rückfall auf BEFORE ${BEFORE}."
            fi
            # KEIN --paginate: die Compare-API paginiert die COMMITS, nicht die
            # Dateien — mit --paginate käme dieselbe Dateiliste je Seite erneut
            # und blähte die Zählung auf (falsch-`code` wäre harmlos, eine
            # falsche 300er-Kappung dagegen nicht).
            if ! gh api "repos/${REPO}/compare/${BEFORE}...${AFTER}" --jq ".files[]? | ${DATEI_JQ}" > push-roh.txt; then
              echo "art=code" >> "$GITHUB_OUTPUT"
              echo "::warning::Compare-API ${BEFORE}...${AFTER} nicht auswertbar (Force-Push?) — volles Programm."
              exit 0
            fi
            sed 's/^[NA]|//' push-roh.txt > push-dateien.txt
            anzahl=$(grep -c '^N|' push-roh.txt || true)
            echo "Push ${BEFORE}...${AFTER}: ${anzahl} Datei(en)."
            if [ "$anzahl" -eq 0 ] || [ "$anzahl" -ge 300 ]; then
              echo "art=code" >> "$GITHUB_OUTPUT"
              echo "Dateizahl ${anzahl} (leer oder an der API-Kappungsgrenze 300) — volles Programm."
              exit 0
            fi
            # Doku-Menge: alle .md UND keine davon Werkzeug-Konfiguration
            # trotz .md-Endung (WERKZEUG_TROTZ_MD_RE, Anlass PR #619 oben).
            # (Die frühere inventar.ts-Ausnahme ist mit der Löschung von
            # scripts/plan/inventar.ts obsolet — Plan-Neuschnitt 29.8.2026;
            # die Messung dazu steht historisch im Kopf, lit. a.)
            if grep -qvE '\.md$' push-dateien.txt || grep -qE "$WERKZEUG_TROTZ_MD_RE" push-dateien.txt; then
              # Nicht rein Doku — app-ferne Zusatz-Klasse prüfen (CODE_FERN_RE,
              # Kopf dieses Schritts) statt sofort das volle Programm.
              if grep -qvE "$CODE_FERN_RE" push-dateien.txt; then
                echo "art=code" >> "$GITHUB_OUTPUT"
                echo "App-nahe Dateien im Push — volles Programm:"
                grep -vE "$CODE_FERN_RE" -m 20 push-dateien.txt
              else
                echo "art=code-fern" >> "$GITHUB_OUTPUT"
                echo "Nur app-ferne Nicht-Doku-Dateien im Push (${anzahl} Datei(en)) — Bau + alle Node-Tore laufen VOLL, nur die 8 Browser-Shards werden übersprungen (gleiches Skip-Muster wie 'doku')."
              fi
            else
              echo "art=doku" >> "$GITHUB_OUTPUT"
              echo "Reiner Doku-Push (${anzahl} Datei(en)) — Merge-Schutz, Fachänderungs-Riegel, check:plan, check:steuerdeckel, check:steuerflaeche und check:bibliothek laufen ECHT, restliche Code-Tore quittieren."
            fi
            exit 0
          fi
          gh api --paginate "repos/${REPO}/pulls/${PR}/files" --jq ".[] | ${DATEI_JQ}" > pr-roh.txt
          sed 's/^[NA]|//' pr-roh.txt > pr-dateien.txt
          anzahl=$(grep -c '^N|' pr-roh.txt || true)
          echo "PR #${PR}: ${anzahl} Datei(en) über die API, changed_files=${GEMELDET:-?}."
          if [ "${GEMELDET:-x}" != "$anzahl" ]; then
            echo "art=code" >> "$GITHUB_OUTPUT"
            echo "::warning::Dateiliste (${anzahl}) weicht von changed_files (${GEMELDET:-?}) ab — Liste unvollständig. Volles Programm (Fehlerseite: prüfen statt überspringen)."
            exit 0
          fi
          if [ "$anzahl" -eq 0 ]; then
            echo "art=doku" >> "$GITHUB_OUTPUT"
            echo "LEERER DIFF (changed_files=0) — genau die Klasse, die bis 3.8.2026 gar keinen Lauf und damit einen ewig 'expected'en Required-Kontext erzeugte (PR #417). Kontexte werden jetzt gemeldet."
            exit 0
          fi
          if grep -qvE '\.md$' pr-dateien.txt || grep -qE "$WERKZEUG_TROTZ_MD_RE" pr-dateien.txt; then
            # Nicht rein .md (oder Werkzeug-Konfiguration trotz .md-Endung,
            # WERKZEUG_TROTZ_MD_RE oben, Anlass PR #619) — app-ferne
            # Zusatz-Klasse prüfen (CODE_FERN_RE, Kopf dieses Schritts).
            if grep -qvE "$CODE_FERN_RE" pr-dateien.txt; then
              echo "art=code" >> "$GITHUB_OUTPUT"
              echo "App-nahe Dateien im Diff — volles Programm:"
              # KEIN `grep | head`: unter pipefail killt heads früher Exit den
              # grep per SIGPIPE (exit 141) — bei PRs mit >20 App-nahen Dateien
              # starb so der ganze Klassierungs-Job und ALLE Folge-Jobs
              # skippten (real PR #482, 581 Dateien, 13.8.2026). `grep -m 20`
              # begrenzt selbst und braucht keine Pipe.
              grep -vE "$CODE_FERN_RE" -m 20 pr-dateien.txt
            else
              echo "art=code-fern" >> "$GITHUB_OUTPUT"
              echo "Nur app-ferne Nicht-.md-Dateien (${anzahl} Datei(en)) — Bau + alle Node-Tore laufen VOLL, nur die 8 Browser-Shards werden übersprungen."
            fi
          else
            echo "art=doku" >> "$GITHUB_OUTPUT"
            echo "Reine .md-Änderung (${anzahl} Datei(en)) — Merge-Schutz, check:plan, check:steuerdeckel, check:steuerflaeche und check:bibliothek laufen ECHT, restliche Code-Tore quittieren."
          fi

      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-006
      - name: Push-Diät prüfen (grüner merge_group-Lauf am gepushten SHA)
        id: diaet
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          AFTER: ${{ github.event.after }}
        run: |
          set -uo pipefail
          setze() {
            echo "push_diaet=$1" >> "$GITHUB_OUTPUT"
            echo "Push-Diät=$1 — $2"
            exit 0
          }
          if [ "$EVENT" != "push" ] || [ "$REF" != "refs/heads/main" ]; then
            setze false "kein main-Push (Event=${EVENT}, Ref=${REF}) — volles Programm."
          fi
          if ! [[ "${AFTER:-}" =~ ^[0-9a-f]{40}$ ]]; then
            setze false "AFTER='${AFTER:-}' ist kein Commit-SHA — volles Programm."
          fi
          LAEUFE=$(gh api "repos/${REPO}/actions/runs?head_sha=${AFTER}&event=merge_group&per_page=100" \
            --jq '.workflow_runs[] | select(.path == ".github/workflows/ci.yml") | "\(.id)|\(.head_sha)|\(.event)|\(.status)|\(.conclusion // "offen")"') \
            || setze false "actions/runs zu ${AFTER} nicht auswertbar — volles Programm."
          if [ -z "$LAEUFE" ]; then
            setze false "kein merge_group-Lauf am gepushten SHA ${AFTER} (Direkt-Push, Queue aus, Merge-Knopf) — volles Programm."
          fi
          BELEGT=""
          BAU_PERF=true
          while IFS='|' read -r ID SHA EV STATUS SCHLUSS; do
            if [ "$SHA" != "$AFTER" ] || [ "$EV" != "merge_group" ]; then
              setze false "Lauf ${ID} passt nicht (sha=${SHA}, event=${EV}) — volles Programm."
            fi
            if [ "$STATUS" != "completed" ] || [ "$SCHLUSS" != "success" ]; then
              setze false "merge_group-Lauf ${ID} steht auf ${STATUS}/${SCHLUSS} — volles Programm."
            fi
            JOBS=$(gh api "repos/${REPO}/actions/runs/${ID}/jobs?filter=latest&per_page=100" \
              --jq '.jobs[] | "\(.status)|\(.conclusion // "offen")|\(.name)"') \
              || setze false "Jobs von Lauf ${ID} nicht auswertbar — volles Programm."
            for pflicht in "Tore (Tests · Lint · Checks)" "Merge-Schutz (Required-Kontext)" "Browser-Smoke (Ergebnis)" "Perf-Budget (§15 — nur bei grüner Treue)"; do
              STAND=$(echo "$JOBS" | awk -F'|' -v n="$pflicht" '$3 == n { print $1 "|" $2 }')
              case "${pflicht}#${STAND}" in
                *"#completed|success") ;;
                "Perf-Budget"*"#completed|skipped") ;;
                *) STAND=${STAND//$'\n'/ + } # doppelter Kontext ⇒ Meldung einzeilig
                   setze false "Pflicht-Kontext «${pflicht}» in Lauf ${ID}: '${STAND:-fehlt}' — volles Programm." ;;
              esac
            done
            for zusatz in "Bau (dist-Artefakt)" "Perf-Budget (§15 — nur bei grüner Treue)"; do
              Z=$(echo "$JOBS" | awk -F'|' -v n="$zusatz" '$3 == n { print $1 "|" $2 }')
              [ "$Z" = "completed|success" ] || BAU_PERF=false
            done
            BELEGT="${BELEGT} ${ID}"
          done <<< "$LAEUFE"
          if [ -z "$BELEGT" ]; then
            setze false "kein Lauf ausgewertet — volles Programm."
          fi
          echo "bau_perf_belegt=${BAU_PERF}" >> "$GITHUB_OUTPUT"
          echo "Bau/Perf im merge_group-Lauf echt grün gelaufen: ${BAU_PERF}"
          setze true "merge_group-Lauf(e)${BELEGT} an ${AFTER} grün, alle vier Pflicht-Kontexte belegt ⇒ identischer Stand. Tore/e2e laufen auf main nicht erneut."

  bau:
    name: Bau (dist-Artefakt)
    needs: diff
    # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-007
    if: >-
      !cancelled()
      && needs.diff.outputs.art != 'doku'
      && needs.diff.outputs.bau_perf_belegt != 'true'
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Zurich
    steps:
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-008
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npx -y npm@11 ci
      # gen:suchindex + tsc -b + vite build + prerender — tsc-Fehler reissen
      # hier die ganze Kette, bevor tore/e2e überhaupt starten.
      - name: Build
        run: npm run build
      - name: dist-Artefakt hochladen (für tore + e2e-Shards + perf)
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1
          include-hidden-files: true

  tore:
    name: Tore (Tests · Lint · Checks)
    needs: diff
    # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-009
    if: >-
      !cancelled()
      && needs.diff.outputs.push_diaet != 'true'
    runs-on: ubuntu-latest
    env:
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-010
      TZ: Europe/Zurich
    steps:
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-011
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npx -y npm@11 ci
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-013
      - name: Fachänderungs-Riegel (§6.3 + Fachaenderung-Trailer)
        env:
          GH_TOKEN: ${{ github.token }}
          FACHAENDERUNG_PR: ${{ github.event.pull_request.number }}
        run: npm run check:fachaenderung
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-014
      - name: Squash-Schutz (kein [skip ci] in PR-Commits)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          treffer=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/commits" --paginate \
            --jq '.[] | select(.commit.message | test("\\[(skip ci|ci skip)\\]"; "i")) | "\(.sha[0:9]) \(.commit.message | split("\n")[0])"' || true)
          if [ -n "$treffer" ]; then
            echo "::error::Squash-Schutz ROT — Commits mit [skip ci] im PR (landen sonst in der main-Message und schalten CI+Deploy stumm):"
            echo "$treffer"
            echo "Abhilfe: Betreff umschreiben (Rebase) oder den PR mit --merge/--rebase statt Squash landen."
            exit 1
          fi
          echo "Squash-Schutz grün — kein [skip ci] in den PR-Commits."
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-015
      - name: Fremd-PR-Tor (Dateigrenzen + Kommentar-Bilanz, Jules-Branches)
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if ! [[ "$HEAD_REF" =~ [0-9]{19} || "$HEAD_REF" =~ ^jules[-/] ]]; then
            echo "Fremd-PR-Tor: nicht zuständig ($HEAD_REF)"; exit 0
          fi
          git fetch -q origin main
          basis=$(git merge-base origin/main HEAD)
          ausserhalb=$(git diff --name-only "$basis"..HEAD | grep -v '^src/' || true)
          if [ -n "$ausserhalb" ]; then
            echo "Fremd-PR-Tor ROT — Jules-Branch ändert Dateien ausserhalb src/**:"; echo "$ausserhalb"; exit 1
          fi
          npx vite-node scripts/analyse/kommentar-bilanz.ts "$basis" HEAD 'src/*.ts' 'src/*.tsx'
          echo "Fremd-PR-Tor grün ($HEAD_REF, Basis ${basis:0:8})"
      - name: Plan-Inventar-Konsistenz (Node-only, günstig — darum vor tsc/Build)
        run: npm run check:plan
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-016
      - name: Steuerungs-Deckel (Byte-Budgets Steuer-Doku + Wächter-Flächen)
        run: npm run check:steuerdeckel
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-017
      - name: Steuerungs-Fläche (Sperrklinke, Byte-Summe + Anhebungs-Schutz)
        run: npm run check:steuerflaeche
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-018
      - name: Tests (volle Ausgabe)
        if: needs.diff.outputs.art != 'doku'
        run: npm test
      - name: Lint (volle Ausgabe, nie tail!)
        if: needs.diff.outputs.art != 'doku'
        run: npm run lint
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-019
      - name: Bibliotheks-Standards (S1–S10)
        run: npm run check:bibliothek
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-020
      - name: Abnahme-Dossiers synchron zu den Schemas (§5-Projektion)
        if: needs.diff.outputs.art != 'doku'
        run: npm run check:dossiers
      - name: Logik-Sweep (Invarianten)
        if: needs.diff.outputs.art != 'doku'
        run: npm run check:sweep
      - name: Golden-Outputs (byte-gleich zur committeten Basis)
        if: needs.diff.outputs.art != 'doku'
        run: npm run golden:vergleich
      - name: SSR-Smoke (alle Seiten)
        if: needs.diff.outputs.art != 'doku'
        run: npm run check:smoke
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-021
      - name: Spruchkörper-Projektion (Leak · Konsistenz · Determinismus)
        if: needs.diff.outputs.art != 'doku'
        run: npm run check:besetzung
      - name: Entscheid-Korpus (Bund)
        if: needs.diff.outputs.art != 'doku'
        run: npm run check:entscheide
      - name: Entscheid-Korpus (BS)
        if: needs.diff.outputs.art != 'doku'
        run: npm run check:bs-entscheide
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-022
      - name: normKeys-Abdeckung (Verzahnung Rechtsprechung ↔ Gesetz)
        if: needs.diff.outputs.art != 'doku'
        run: npm run check:normkeys
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-023
      - name: Bezugs-Schicht (Facetten · Projektion · Grundgesamtheit)
        if: needs.diff.outputs.art != 'doku'
        run: npm run check:bezuege
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-024
      - name: Kantonale Zitat-Bruecke (Referenz-Integritaet)
        if: needs.diff.outputs.art != 'doku'
        run: npm run check:normkeys-kanton
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-025
      - name: Tor-Parität (CI/lokal)
        if: needs.diff.outputs.art != 'doku'
        run: npm run check:tor-paritaet
      - name: Dispatch-Pflichtklausel (§0-Generator lauffähig)
        if: needs.diff.outputs.art != 'doku'
        run: npm run check:dispatch-klausel
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-026
      - name: Lizenz-Tor (Abhängigkeiten)
        run: npm run check:lizenzen
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-027
      - name: Darstellungs-Kanon (Tokens · Drift · Farbwelt · Linien · p-Klassen)
        if: needs.diff.outputs.art != 'doku'
        run: npm run check:design-tokens && npm run check:tokens-drift && npm run check:farbwelt && npm run check:linien-kanon && npm run check:p-klassen
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-028
      - name: UI-Normzitate (Korpus-Abgleich)
        if: needs.diff.outputs.art != 'doku'
        run: npm run check:ui-normzitate
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-029
      - name: Verweis-Inventar (Basislinie)
        if: needs.diff.outputs.art != 'doku'
        run: npm run check:verweis-inventar
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-030
      - name: Artikel-Bestand (Projektion gegen Snapshots)
        if: needs.diff.outputs.art != 'doku'
        run: npm run check:artikel-bestand
      - name: Import-Zyklen
        if: needs.diff.outputs.art != 'doku'
        run: npm run check:zyklen
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-031
      - name: Sediment (tote Klassen · verwaiste Module · doppelte Metadaten)
        if: needs.diff.outputs.art != 'doku'
        run: npm run check:sediment
      - name: Normtext-Projektionen (Vollständigkeit · Zähler · Historie · Revisionen)
        if: needs.diff.outputs.art != 'doku'
        run: npm run check:vollstaendigkeit && npm run check:zaehler && npm run check:bezuege-zaehler && npm run check:historie && npm run check:revisionen && npm run check:artikel-revisionen
      - name: Normtext-Struktur (Tabellen · Grundart · Invarianten)
        if: needs.diff.outputs.art != 'doku'
        run: npm run check:tabellen && npm run check:grundart && npm run check:invarianten
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-032
      - name: Entstehung (Deckel · Anker-Provenienz · Deckung je Erlass)
        if: needs.diff.outputs.art != 'doku'
        run: npm run check:entstehung
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-033
      - name: Kantonale Materialien BS (Herkunft · Personendaten · Reproduktion)
        if: needs.diff.outputs.art != 'doku'
        run: npm run check:bs-materialien
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-034
      - name: ZH-Vollständigkeit (Artefakt-Teil, ohne PDF)
        if: needs.diff.outputs.art != 'doku'
        run: npm run check:zh-vollstaendigkeit -- --artefakt
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-035
      - name: ZH-Randtitel (Artefakt-Teil, ohne PDF)
        if: needs.diff.outputs.art != 'doku'
        run: npm run check:zh-randtitel -- --artefakt
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-036
      - name: Normtext-Korpus (Drift/Coverage · Struktur-Konsistenz · Verklebung · Stand-Zukunft)
        if: needs.diff.outputs.art != 'doku'
        run: npm run check:normtext && npm run check:struktur-konsistenz && npm run check:verklebung && npm run check:stand-zukunft
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-037
      - name: Normtext-Leerstellen (aufgehoben strukturell, Zuwachs-Riegel)
        if: needs.diff.outputs.art != 'doku'
        run: npm run check:leerstellen
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-038
      - name: Confidence-Frische (korpus.sha ↔ daten-manifest.json)
        if: needs.diff.outputs.art != 'doku'
        run: npm run check:confidence-frische
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-039
      - name: Golden-Vollständigkeit (Normtext-Index ⊇⊆ Snapshots)
        if: needs.diff.outputs.art != 'doku'
        run: npm run check:golden-normtext
      - name: Quellen-Projektionen (PDF · PDF-Quellen · Bilder)
        if: needs.diff.outputs.art != 'doku'
        run: npm run check:pdf && npm run check:pdf-quellen && npm run check:bilder
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-040
      - name: Datenhaltungs-Manifest · Byte-Parität DB↔Projektion · Feed
        if: needs.diff.outputs.art != 'doku'
        run: npm run check:datenhaltung && npm run check:paritaet && npm run check:feed
      - name: SEO-Index · Verfall-UI
        if: needs.diff.outputs.art != 'doku'
        run: npm run check:seo-index && npm run check:verfall-ui
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-012
      # Am Job-Ende + !cancelled() (25.9.2026, Lauf 36140683376: erster Schritt
      # rot bis zum Verdikt, 43 Tore übersprungen); Job bleibt rot, wenn rot.
      - name: Merge-Schutz (Gegenprüfungs-Verdikt auf Risikopfaden)
        if: ${{ !cancelled() }}
        run: npm run check:merge-schutz
      - name: Kurzquittung (Doku-/Leer-Diff)
        if: needs.diff.outputs.art == 'doku'
        run: echo "Kein Code im Diff — Merge-Schutz, check:plan, check:steuerdeckel, check:steuerflaeche und check:bibliothek sind oben ECHT gelaufen; die übrigen Code-Tore sind nicht betroffen."

  e2e:
    name: Browser-Smoke Shard ${{ matrix.gruppe }}/8 (Playwright)
    needs: [diff, bau]
    # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-041
    if: >-
      !cancelled()
      && needs.bau.result == 'success'
      && needs.diff.outputs.art != 'doku'
      && needs.diff.outputs.art != 'code-fern'
      && needs.diff.outputs.push_diaet != 'true'
    runs-on: ubuntu-latest
    # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-042
    timeout-minutes: 28
    env:
      TZ: Europe/Zurich
    strategy:
      fail-fast: false
      matrix:
        gruppe: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npx -y npm@11 ci
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-043
      - name: e2e-Shard-Union-Wächter (Gruppen == playwright --list)
        run: npm run check:e2e-shards
      - name: dist-Artefakt herunterladen (aus `bau`, nicht neu bauen)
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Playwright-Browser-Cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-044
      - name: Playwright-Browser (Chromium)
        run: bash scripts/ci/playwright-install.sh
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-045
      - name: Browser-Smoke (Playwright, e2e/ gegen dist — Gruppe ${{ matrix.gruppe }}/8)
        run: npm run test:e2e:gruppe -- ${{ matrix.gruppe }}
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-046
      - name: Playwright-JSON-Report ablegen (Shard-Balancing-Datengrundlage)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-gruppe-${{ matrix.gruppe }}
          path: playwright-report.json
          retention-days: 7
          if-no-files-found: warn
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-047
      - name: Flacker-Wächter (Retry-Grün ist kein Grün)
        if: ${{ !cancelled() }}
        run: npm run check:e2e-flake
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-048
      - name: Playwright-Traces ablegen (nur bei rotem Shard)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-gruppe-${{ matrix.gruppe }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-049
  e2e-ergebnis:
    name: Browser-Smoke (Ergebnis)
    needs: [diff, e2e]
    # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-050
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Shard-Ergebnis gegen die Diff-Klasse werten
        env:
          ERGEBNIS: ${{ needs.e2e.result }}
          ART: ${{ needs.diff.outputs.art }}
          DIAET: ${{ needs.diff.outputs.push_diaet }}
        run: |
          set -euo pipefail
          echo "e2e=${ERGEBNIS} · art=${ART:-<leer>} · push_diaet=${DIAET:-<leer>}"
          if [ "${ERGEBNIS}" = "success" ]; then
            echo "Alle Browser-Shards grün."
            exit 0
          fi
          if [ "${ERGEBNIS}" = "skipped" ] && { [ "${ART}" = "doku" ] || [ "${ART}" = "code-fern" ] || [ "${DIAET}" = "true" ]; }; then
            echo "Browser-Shards planmässig übersprungen (art=${ART:-<leer>}, push_diaet=${DIAET:-<leer>}) — Begründung im Job \`diff\`."
            exit 0
          fi
          echo "::error::Browser-Smoke nicht bestanden: needs.e2e.result=${ERGEBNIS}, art=${ART:-<leer>}, push_diaet=${DIAET:-<leer>}. Ein Skip ist nur bei art=doku, art=code-fern oder push_diaet=true zulässig."
          exit 1

  perf:
    name: Perf-Budget (§15 — nur bei grüner Treue)
    # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-051
    if: >-
      !cancelled()
      && github.event_name != 'pull_request'
      && needs.diff.outputs.art == 'code'
      && needs.diff.outputs.bau_perf_belegt != 'true'
      && needs.bau.result == 'success'
      && (needs.tore.result == 'success' || needs.tore.result == 'skipped')
      && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
    # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-052
    needs: [diff, bau, tore, e2e]
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Zurich
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npx -y npm@11 ci
      - name: dist-Artefakt herunterladen (aus `bau`, nicht neu bauen)
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Playwright-Browser-Cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-053
      - name: Playwright-Browser (Chromium)
        run: bash scripts/ci/playwright-install.sh
      - name: Perf-Budget — Bundle-Topologie (Chrome-frei)
        run: npm run check:perf-budget
      - name: Perf-Budget — Lighthouse-Metriken (4× CPU + langsames 4G)
        run: npm run check:perf-lighthouse

  # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-054
  merge-schutz:
    name: Merge-Schutz (Required-Kontext)
    # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-055
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npx -y npm@11 ci
      - name: Gegenprüfungs-Verdikt auf Risikopfaden (committeter Bereich)
        run: npm run check:merge-schutz

  # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-056
  deploy:
    name: Deploy (Prod, Vercel CLI)
    needs: [diff, tore, bau, e2e]
    if: >-
      !cancelled()
      && needs.diff.result == 'success'
      && (needs.bau.result == 'success' || needs.bau.result == 'skipped')
      && (needs.tore.result == 'success' || needs.tore.result == 'skipped')
      && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
      && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main'
          && needs.diff.outputs.art != 'doku')
        || (github.event_name == 'workflow_dispatch'
          && github.event.inputs.probe == 'ohne-token')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-057
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    env:
      # Wie `bau`/`tore`: der prerenderte Stand entsteht in der Produkt-Zeitzone,
      # nicht in UTC — sonst läge ein anderer Bau live als der getestete.
      TZ: Europe/Zurich
      VERCEL_ORG_ID: team_jfUx2xb2Jo3RVYUFYsIW94lG
      VERCEL_PROJECT_ID: prj_1xdIoeM6YjmelXq6DSMpywDOXq2x
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-058
      VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
      VERCEL_GIT_COMMIT_REF: main
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-059
      VERCEL_TOKEN: ${{ github.event.inputs.probe != 'ohne-token' && secrets.VERCEL_TOKEN || '' }}
    steps:
      # §6.7: Dieser Schritt ist der scheiterbare Teil des Tors. Rot-Beweis über
      # `workflow_dispatch` mit probe=ohne-token — siehe PR-Body.
      - name: Token-Vorprüfung (Rot ohne Secret)
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN leer — kein Prod-Deploy. Secret setzen unter Settings → Secrets and variables → Actions → VERCEL_TOKEN (Scope: Team david-legal-projects)."
            exit 1
          fi
          echo "VERCEL_TOKEN vorhanden (Wert wird nie ausgegeben — §18)."
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Vercel — Projekt-Einstellungen ziehen (production)
        run: npx -y vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Vercel — Build (frisch, buildCommand aus vercel.json)
        run: npx -y vercel@latest build --prod --token="$VERCEL_TOKEN"
      - name: Vercel — Deploy (prebuilt → Prod)
        id: deploy
        run: |
          set -euo pipefail
          url=$(npx -y vercel@latest deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN")
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "Deployment-URL: ${url}"
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-060
      - name: Nachkontrolle — live ausgelieferter Build == dieser Commit
        run: |
          set -euo pipefail
          soll="${GITHUB_SHA:0:8}"
          for versuch in 1 2 3; do
            ist=$(curl -sS --max-time 20 https://lexmetrik.vercel.app/ \
              | grep -o 'lexmetrik-build" content="[0-9a-f]*' \
              | cut -d'"' -f3 || true)
            echo "Versuch ${versuch}: live='${ist:-<leer>}' soll='${soll}'"
            if [ "${ist:-}" = "${soll}" ]; then
              echo "Prod liefert ${soll} aus."
              exit 0
            fi
            # Bewusst `if` statt `[ … ] && sleep`: unter `set -e` würde der
            # fehlschlagende Test im letzten Durchlauf den Job sofort beenden —
            # die ::error::-Zeile darunter käme nie zur Ausgabe.
            if [ "$versuch" -lt 3 ]; then sleep 20; fi
          done
          echo "::error::Prod liefert '${ist:-<leer>}' statt '${soll}' — Deploy gemeldet, aber nicht live. Nicht mergen/weiterbauen, bis geklärt (docs/betrieb/rollback-runbook.md)."
          exit 1
      # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-061
      - name: Vercel — alte Stände aufräumen (Deployment Storage)
        continue-on-error: true
        # Anlass/Belege: archiv/ci-yml-kommentare.md#ci-062
        timeout-minutes: 8
        env:
          AKTUELL_URL: ${{ steps.deploy.outputs.url }}
        run: node scripts/betrieb/vercel-aufraeumen.mjs
