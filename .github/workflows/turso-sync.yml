# ─── Turso-Serving-Sync an Daten-Diff gekoppelt (O-2.6, QS-DATA §5 E2) ──────
# Bisher war datenhaltung:turso-sync ein reiner Handlauf — Reader (statische JSONs)
# und Prod-Suche (Turso-Replika) konnten zwei Frische-Wahrheiten servieren. Dieser
# Job synchronisiert die HOT-Replika automatisch, sobald sich auf main die
# servierten Korpus-Daten aendern, und prueft danach die Live-Paritaet.
#
# Secret TURSO_AUTH_TOKEN (Schreib-Token) — David-Rahmen-Gate 16.7.2026 freigegeben.
# Ohne Secret degradiert der Job ehrlich (ueberspringt den Sync, meldet es).
#
# ── Reparatur 20.7.2026: warum der Frische-Waechter existiert ──────────────────────────
# Vom 18. bis 20.7.2026 lief `sync` sechsmal in `timeout-minutes: 20` und wurde jedes Mal
# `cancelled`. GitHub faerbt einen abgebrochenen Lauf GRAU, nicht rot — es fiel tagelang
# niemandem auf, obwohl BS-Import #300 (3765 Entscheide), G-REF #299, ASYLV2 #304 und die
# Richter-PRs #309/#310 nie in die Suche gelangten. Ursache war NICHT der Timeout, sondern
# der Transport: der Sync schickte je Zeile ein eigenes Hrana-`execute`, also einen durablen
# Commit PRO ZEILE (~33 Zeilen/s → 46 min fuer 61k Zeilen). Behoben in turso-sync.ts durch
# Mehrzeilen-INSERTs in BEGIN/COMMIT (gemessen 43x schneller). Zwei Konsequenzen hier:
#   1. `timeout-minutes` bleibt eine ECHTE Notbremse mit Reserve, nicht die Loesung.
#   2. `check:turso-frische` wird ROT, wenn die Replika hinterherhinkt oder unvollstaendig
#      ist. Ein abgebrochener Sync kann damit nicht mehr schweigen — genau das war der
#      eigentliche Schaden (§8). Bis zum 15.9.2026 lief der Waechter als EIGENER Job
#      `frische` fuer den cron-Zweig; seit der Buendelung unten steckt er im Tageslauf
#      selbst — samt seinem harten Token-Riegel (siehe dort).
#
# ── Buendelung 15.9.2026 (QS-TURSO-SCHREIBVOLUMEN, FAHRPLAN-DATENHALTUNG §17) ──────────
# BIS HIERHER lief dieser Workflow bei JEDEM Push auf main, der Daten- oder Schema-Pfade
# beruehrte, und baute dabei alle fuenf HOT-Tabellen komplett neu: 171 065 Zeilen je Lauf,
# 39 Laeufe vom 1.–14.9.2026 ≈ 6,7 Mio Zeilen — und Turso zaehlt bei indexierten Tabellen
# jede betroffene Index-Zeile zusaetzlich (turso.tech/pricing, FAQ «rows written», Abruf
# 15.9.2026). Am 15.9.2026 sperrte Turso das Schreiben (Mail «Writes Blocked», Organisation
# ravedave, Gratisplan). Lesen war nie gesperrt: api/suche lieferte an demselben Tag HTTP 200
# mit Treffern. Entscheid David 15.9.2026: nicht zahlen, Wurzel-Fix bauen.
#
# DER PUSH-TRIGGER IST DARUM WEG. Der Sync laeuft EINMAL taeglich (cron 05:17 UTC) plus
# `workflow_dispatch`; innerhalb des Laufs baut turso-sync.ts nur noch die Tabellen neu,
# deren Signatur oder Zeilenzahl nicht mehr stimmt (Skip-Plan, scripts/datenhaltung/turso-skip.ts).
#
# PREIS, ehrlich benannt (§8): ein gelandeter Korpus-Stand ist bis zum naechsten Tageslauf
# in der SUCHE noch nicht sichtbar. Die Seiten selbst sind sofort aktuell — sie kommen aus
# den prerenderten Projektionen, nicht aus der Replika. Wer nicht warten will, stoesst den
# Workflow von Hand an (`workflow_dispatch`). `check:turso-frische` bleibt davon unberuehrt:
# er faellt erst nach MAX_ALTER_TAGE (7) ueber das Alter, ein Tag Verzug ist kein Rot.
#
# Die frueheren `paths` (Gegenpruefungs-Befund F1 zu QS-BASIS (d), 31.8.2026) deckten neben
# den Daten auch alle Flaechen ab, die das Replika-SCHEMA bestimmen — Generator- und
# Sync-Code, scripts/suche-felder.ts, api/suche.ts. Der Befund selbst bleibt gueltig, seine
# Absicherung aber lag nie im Trigger: `paths` war immer ein Ausloeser, nie ein Beweis. Der
# unabhaengige Riegel derselben Klasse steht in check-turso-frische.ts (Pruefung 0 SCHEMA:
# DDL der Replika gegen `ddlFtsArtikel()`/`ddlFtsEntscheide()`), und seit dem 15.9.2026
# zusaetzlich in der Skip-Signatur selbst: die DDL geht in `sig_<tabelle>` ein, eine
# Schema-Aenderung erzwingt also den Neuaufbau, statt uebersprungen zu werden.
name: Turso-Serving-Sync

on:
  schedule:
    # Taeglich 05:17 UTC — der EINE Sync-Lauf des Tages (Buendelung 15.9.2026, s. o.).
    - cron: '17 5 * * *'
  workflow_dispatch:

concurrency:
  group: turso-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Build HOT-Artefakt · Turso-Sync · Frische · Live-Paritaet
    runs-on: ubuntu-latest
    # AUSGANGSLAGE (workflow_dispatch 20.7.2026, Lauf 29757068566): 32,8 min gesamt, davon
    # 22,3 min allein `fts_entscheide_schaufenster` (5093 Zeilen, 165 MiB) bei ~128 KiB/s.
    # Dass die Phase lokal ueber eine Heim-Leitung EBENFALLS so langsam lief, schloss die
    # Bandbreite als Ursache aus — die Ursache selbst blieb damals aber unbelegt.
    #
    # SIE IST JETZT GEMESSEN UND BEHOBEN (QS-CODE-TURSO, 4.8.2026). Nullprobe ueber dieselbe
    # Nutzlast (200 Zeilen / 7,07 MiB, je n=3, Median): Zeilen in eine standalone FTS5-Tabelle
    # 19,9 s (364 KiB/s), dieselben Zeilen in eine GEWOEHNLICHE Tabelle 7,8 s (946 KiB/s).
    # Der Aufschlag steckte also im FTS5-Schreibpfad der Gegenseite, die denselben Text ein
    # zweites Mal tokenisierte und indexierte — und er wuchs mit dem Index (364 KiB/s bei
    # 200 Zeilen, 437 bei 500, 120 ueber den vollen Korpus). Der Sync uebertraegt darum jetzt
    # den lokal fertigen FTS5-Index statt der Zeilen. Herleitung und Riegel:
    # scripts/datenhaltung/turso-fts-index.ts + turso-sync.ts.
    #
    # PAARMESSUNG ueber den VOLLEN Korpus, gleiche Maschine/Leitung, unmittelbar nacheinander,
    # in Wegwerf-Tabellen (`qsct_mess_*`, danach nachweislich gedroppt):
    #   alter Pfad (Zeilen → FTS5) ..... 872,7 s          (n=1)
    #   neuer Pfad (Index-Transfer) .... 388,1 / 428,5 s  (n=2, Median 408 s)
    # → Faktor ~2,1x bei 254 statt 165 MiB Nutzlast; Trefferzahlen, bm25-Rangfolge und
    # Snippets waren BYTE-IDENTISCH. Die Messung lief LOKAL — was der CI-Runner daraus macht,
    # zeigt erst der naechste echte Lauf. Uebertraegt sich der Faktor, faellt die
    # Entscheid-Phase von 22,3 auf ~10 min.
    #
    # `timeout-minutes: 90` bleibt UNVERAENDERT: der Timeout ist die Notbremse, nicht die
    # Steuerung. Entscheidend ist nicht sein Wert, sondern dass die Reserve nicht mehr gegen
    # eine SUPERLINEARE Kurve steht — der neue Pfad skaliert mit den Bytes, der alte wurde
    # mit wachsendem Index ueberproportional langsamer. Genau das war der Grund, warum das
    # Budget mit dem Korpus zu REISSEN drohte statt bloss langsamer zu werden.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npx -y npm@11 ci

      # HARTER Token-Riegel. Er stand bis zum 15.9.2026 nur im taeglichen `frische`-Job; der
      # Sync-Job daneben degradierte weich (Warnung, Sync uebersprungen, Lauf gruen). Seit
      # der Buendelung ist DIESER Job der taegliche Lauf — die weiche Variante wuerde also
      # genau das Loch aufreissen, gegen das der Riegel gebaut war: faellt oder verfaellt das
      # Secret, waere der Wachhund fuer immer gruen, ohne je zu pruefen oder zu syncen (§8).
      # Beide Ausloeser (cron, workflow_dispatch) laufen aus diesem Repo, das Secret steht
      # ihnen also gleichermassen zur Verfuegung; eine weiche Stufe haette hier keinen Fall
      # mehr, den sie abfedern koennte (§6.7 — was nicht scheitern kann, gehoert weg).
      - name: Token vorhanden? (HART — ohne Token wird weder gesynct noch geprueft)
        env:
          T: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          if [ -z "$T" ]; then
            echo "::error::TURSO_AUTH_TOKEN fehlt — Sync und Frische-Waechter koennen nichts tun."
            exit 1
          fi

      # Cache fuer die drei DB-Dateien, die `datenhaltung:build` erzeugt (normtext/
      # rechtsprechung/soft-law). Schluessel deckt DATEN (daten-manifest.json) UND
      # GENERATOR (scripts/datenhaltung/**) sowie package-lock.json ab — das Manifest
      # fingerprintet nur die Daten, nicht den Bau-Code; ohne den Generator im Schluessel
      # wuerde ein reiner Code-Fix (z. B. eine Extraktionsregel) stumm den alten DB-Stand
      # aus dem Cache ziehen. KEIN restore-keys: ein Praefix-Treffer waere ein ALTERER
      # Stand, der nie als aktuell gelten darf (§2/§5) — bei Miss wird immer frisch gebaut.
      # suche-felder.ts ist FTS-Bau-Input ausserhalb datenhaltung/ (Befund F1 31.8.2026) — darum im Schlüssel.
      - name: Cache HOT-Artefakt (DB-Dateien)
        id: db-cache
        uses: actions/cache@v4
        with:
          path: |
            daten/normtext.db
            daten/rechtsprechung.db
            daten/soft-law.db
          key: db-${{ runner.os }}-${{ hashFiles('daten-manifest.json', 'scripts/datenhaltung/**', 'scripts/suche-felder.ts', 'package-lock.json') }}

      - name: HOT-Artefakt bauen (aus committeten JSONs, reproduzierbar)
        if: steps.db-cache.outputs.cache-hit != 'true'
        run: npm run datenhaltung:build

      # Beweist, dass der SOEBEN gebaute lokale Stand zum committeten daten-manifest.json
      # passt — nicht nur in den Zeilenzahlen (das prueft der Quell-Riegel im Sync selbst),
      # sondern ueber die Inhalts-SHAs je Tabelle. Ohne diesen Schritt koennte ein
      # verstuemmelter Build synchronisiert werden und waere danach ueberall gruen, weil
      # sich die ganze Kette gegen ihre eigene Ladung validiert (Gegenpruefung Runde 4).
      # Laeuft sonst nur im PR-Gate (`check:seriell`), also nicht auf diesem Pfad.
      - name: Build gegen committetes Manifest pruefen (check:datenhaltung)
        run: npm run check:datenhaltung

      # Exit 3 bedeutet: Turso hat das Schreiben wegen des Monatskontingents gesperrt (die
      # Meldung des Skripts sagt es als ::error::). Der Schritt faellt dann rot — richtig so:
      # die Replika hinkt ab diesem Moment nach, und das soll nicht schweigen (§8). Lesen und
      # Suche laufen dabei weiter; der Reset kommt am 1. des Monats.
      - name: Turso-Sync (tabellenweiser Rebuild ueber Schatten-Tabellen, determinismus-beweisbar)
        env:
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: npm run datenhaltung:turso-sync

      # Harter Schritt: beweist, dass die Replika den committeten Stand traegt UND
      # vollstaendig ist. Faengt insbesondere den halb-gedroppten Zustand, der vorher
      # tagelang unbemerkt live lag.
      - name: Frische-Waechter (Replika == committetes daten-manifest.json)
        env:
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: npm run check:turso-frische

      - name: Live-Paritaets-Stichprobe (Prod /api/suche, Artikel UND Entscheide)
        run: |
          set -uo pipefail
          basis="https://lexmetrik.vercel.app/api/suche"
          fehler=0
          # Bis zu 5 Versuche mit Pause, danach ROT. (Frueher war jeder Nicht-200 nur eine
          # Warnung; damit konnte die Stichprobe dauerhaft nichts pruefen, ohne je rot zu
          # werden.) Die Wiederholung stammt aus der Zeit, als dieser Job unmittelbar nach
          # einem Merge lief und gegen ein noch deployendes Prod probte; seit der Buendelung
          # 15.9.2026 laeuft er nachts, die Reserve bleibt aber als Netzpuffer stehen.
          probe() {
            local q="$1" feld="$2" versuch=1 code gesamt
            while [ "$versuch" -le 5 ]; do
              code=$(curl -s -o /tmp/r.json -w '%{http_code}' --max-time 25 "${basis}?q=${q}") || code=000
              if [ "$code" = "200" ]; then
                gesamt=$(jq -r ".${feld}.gesamt // 0" /tmp/r.json 2>/dev/null || echo 0)
                if [ "${gesamt:-0}" -gt 0 ] 2>/dev/null; then
                  echo "ok: /api/suche '$q' -> ${feld}.gesamt=${gesamt}"
                  return 0
                fi
                echo "  Versuch ${versuch}: HTTP 200, aber ${feld}.gesamt=${gesamt}"
              else
                echo "  Versuch ${versuch}: HTTP ${code} (Prod evtl. noch am Deployen)"
              fi
              versuch=$((versuch + 1))
              # Nach dem letzten Versuch nicht mehr warten (dieselbe Klasse wie B10 im Sync).
              [ "$versuch" -le 5 ] && sleep 30
            done
            echo "::error::/api/suche '$q' liefert dauerhaft keine ${feld}-Treffer."
            return 1
          }
          for q in "OR%20319" "ZGB%201" "StGB%20111"; do
            probe "$q" artikel || fehler=1
          done
          # Entscheid-Pfad separat — er war es, der komplett fehlte (Tabelle nicht vorhanden).
          probe "Beschwerde" entscheide || fehler=1
          exit $fehler

