# ─── Prod-Smoke: Watchdog über die eigene Live-Site ────────────────
# FAHRPLAN-BASIS-AUSBAU §A5 (B-11). Gegenstück zu normen-monitor.yml (QUELLEN):
# prüft die eigene PROD — Kernrouten, Edge-Suche (JSON-503/200), Sitemap, Assets,
# CSP. Reine Netz-Prüfung ohne Build/Secrets. Bei Rot ein Zettel (Muster: waechter.yml).
name: Prod-Smoke

on:
  schedule:
    - cron: '43 */6 * * *' # alle 6 h (Minute 43, entzerrt gegen andere Jobs)
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Basis-URL (Default lexmetrik.vercel.app)'
        required: false

jobs:
  smoke:
    name: Kernrouten · Edge-Suche · Sitemap · Assets · CSP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      # fetch-depth: 0 — der Prod-Stand-Wächter (QS-AUTOMATIK 16.8.2026) vergleicht
      # den ausgelieferten Build-SHA gegen origin/main. Ein flacher Klon kennt den
      # Build-Commit oft nicht und der Wächter meldete «unbekannter Build-SHA».
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npx -y npm@11 ci
      - name: Prod-Smoke fahren
        env:
          SMOKE_BASE_URL: ${{ github.event.inputs.base_url }}
        run: npm run smoke:prod
      - name: Bei Rot — sichtbaren Aufgaben-Zettel anlegen/aktualisieren
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          trap 'echo "::warning::Zettel-Pflege gescheitert (Z. $LINENO), Lauf unberührt"; exit 0' ERR
          offen=$(gh issue list -s open -l alarm:prod-smoke -S author:app/github-actions --json number -q '.[0].number // empty')
          rumpf="Der Prod-Smoke ist rot — die Live-Site verletzt einen harten Betriebs-Vertrag (Kernroute nicht 200, Edge-Suche liefert HTML statt JSON, Sitemap/Asset weg oder CSP-Kopf fehlt). **Neu seit 16.8.2026**: auch «Prod hinkt hinter main» — dann ist die AUSLIEFERUNG defekt, nicht die Site. Erst den Ignored Build Step und den Deployment-State in Vercel prüfen (READY statt CANCELED), nicht rollbacken. **Rückweg** bei echtem Site-Defekt: docs/betrieb/rollback-runbook.md (\`vercel rollback\`). Lauf: ${RUN_URL}"
          if [ -n "$offen" ]; then
            gh issue comment "$offen" --body "Erneut rot am $(date +%F). ${rumpf}"
          else
            gh label create alarm:prod-smoke -f -c B60205 >/dev/null
            gh issue create --label alarm:prod-smoke --title "🔴 Prod-Smoke rot ($(date +%F)) — Live-Site prüfen / ggf. Rollback" --body "$rumpf"
          fi

      - name: Bei Grün — offenen Zettel schliessen
        if: success() && !inputs.base_url
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          trap 'echo "::warning::Zettel-Pflege gescheitert (Z. $LINENO), Lauf unberührt"; exit 0' ERR
          offen=$(gh issue list -s open -l alarm:prod-smoke -S author:app/github-actions --json number -q '.[0].number // empty')
          [ -z "$offen" ] && exit 0
          gh issue close "$offen" --reason completed --comment "🟢 Wieder grün am $(date +%F): ${RUN_URL}"
