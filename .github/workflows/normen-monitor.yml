# ─── Normen-Monitor: wöchentliche Wache über den BUNDES-GESETZESTEXT ────────
# (STRATEGIE-PLATTFORM.md (git 3fd5db8f9:STRATEGIE-PLATTFORM.md) F2.4 · QS-OPT O-1 · Rückbau MONITOR 5.10.2026)
#
# Entscheid David 5.10.2026: «wichtig ist gesetzestext. der rest muss nicht zu einem rot
# führen.» und «reduziere sonst einfach nur noch auf bund.» Darum zwei Klassen in EINEM
# Lauf (`npm run check:netz`, Runner scripts/run-netz-alle.ts — Klassen-Begründung dort):
#   • ROT + Alarm-Zettel nur, wenn gespeicherter BUNDES-Normtext/Pin von der amtlichen
#     Fassung abweicht oder ein Zitat ins Leere zeigt (`check:netz:kette`: caches · zitate ·
#     fedlex-versionen · pdf-netz). Ein Kanonik-Wechsel ohne Textänderung
#     ist nur ein Hinweis (fedlex-frische.yml re-pinnt ihn von selbst).
#   • Nicht erreichbare Quelle (Exit 2) eines Bundes-Glieds: Wiederholung nach 90 s;
#     bleibt sie, ist der Lauf UNVOLLSTÄNDIG — Netz-Zettel (alarm:normen-monitor-netz), kein
#     Schliessen des Alarm-Zettels. Ist der Netz-Zettel schon offen (voriger Lauf ebenso
#     blind), wird der Lauf ROT: dauerhafte Blindheit spätestens im zweiten Wochenlauf
#     (Gegenprüfung 5.10.2026, Befund 1). Vollständiger Lauf schliesst den Netz-Zettel.
#   • Alles andere (`check:netz:bericht`: KANTONS-Drift `normtext-netz` — LexWork, HTM, ZH,
#     kantonale PDFs; Kantone ruhen bis Phase 2 —, Materialien, Revisionen, Abkürzungen,
#     BE-Sprengel, Tarif, FR/IT, Verfall, LIK) erscheint als Wochenbericht in der Lauf-Zusammenfassung
#     (::warning:: + Tafel), färbt den Lauf aber NICHT rot und öffnet keinen Zettel (auch
#     Exit 2 eines Bericht-Glieds nicht). Wo ein Generator existiert,
#     führen die Bots nach: normen-monatslauf.yml (Curia, BS-Grossrat, Vernehmlassungen),
#     fedlex-frische.yml (Re-Pins, Revisionen) und seit 6.10.2026 materialien-nachzug.yml
#     (Materialien-Snapshots SECO/EDÖB/ESTV, montags 05:43 UTC — VOR diesem Lauf; meldet der
#     Bericht hier trotzdem Materialien-Drift, ist es ein Netz-Hinweis oder ein Bot-Entwurf, der
#     auf Prüfung wartet); der Rest bleibt Handarbeit nach Bericht (§7: Fedlex-Abkürzungen,
#     Tarif, LIK, Verfall). (Bis 6.10.2026 stand hier «Materialien-Snapshots» bei der Handarbeit.)
# Gestrichen im Rückbau (nie ein echter Befund): Prod-Smoke-Duplikat (prod-smoke.yml prüft
# die Live-Site alle 6 h, inkl. der Korpus-JSONs), Runtime-API-Vertragstests, rss-oc,
# pdf-quellen-netz, vernehmlassungen-alter; ebenso die Eskalationsstufe des Zettels.
name: Normen-Monitor

on:
  schedule:
    # Montags 07:17 UTC — 2,5 h NACH dem Reparatur-Arm (fedlex-frische.yml, 04:43 UTC):
    # erst reparieren, dann messen (QS-MONITOR-ROT, 1.9.2026). Die Monatsläufe liegen seit
    # 1.10.2026 in normen-monatslauf.yml.
    - cron: '17 7 * * 1'
  workflow_dispatch:

env:
  # Zeitzone wie ci.yml: Verfallstermine (`check:verfall`) sind Kalendertage in Zürich.
  TZ: Europe/Zurich

jobs:
  normen:
    name: Bundes-Gesetzestext (check:netz) · Wochenbericht
    runs-on: ubuntu-latest
    # Notbremse mit Reserve, nicht Taktgeber (Lauf 5.10.2026: ~25 min seriell).
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npx -y npm@11 ci

      # Netz-Grenze: war schon der vorige Lauf unvollständig (Netz-Zettel offen), macht ein
      # erneuter Exit 2 den Lauf rot. Abfrage scheitert ⇒ Warnung, Lauf misst trotzdem.
      - name: Netz-Zettel offen? (Zwei-Wochen-Grenze für Exit 2)
        id: netzzettel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trap 'echo "::warning::Netz-Zettel-Abfrage gescheitert (Z. $LINENO) — Grenze diesen Lauf nicht scharf"; exit 0' ERR
          nr=$(gh api "repos/$GITHUB_REPOSITORY/issues?labels=alarm:normen-monitor-netz&state=open&creator=github-actions%5Bbot%5D" -q '[.[]|select(.pull_request|not)][0].number // empty')
          echo "nummer=${nr}" >> "$GITHUB_OUTPUT"

      - name: Bundes-Gesetzestext rot · Rest Bericht — npm run check:netz
        id: netz
        env:
          NETZ_TAFEL_DATEI: ${{ runner.temp }}/netz-tafel.md
          NETZ_ZETTEL_OFFEN: ${{ steps.netzzettel.outputs.nummer != '' && '1' || '' }}
        run: npm run check:netz

      # EIN Zettel (Label alarm:normen-monitor): bei Rot anlegen, falls keiner offen ist;
      # kein Wiederhol-Kommentar (Leser ist die Startabfrage jeder Session:
      # gh issue list --state open --author "github-actions[bot]", Skill bauschritt).
      # ERR-Trap → Warnung statt Lauf-Rot (Zettel-Muster waechter.yml, 1.10.2026).
      # Nur bei rotem check:netz (nicht bei Infrastruktur-Rot wie `npm ci` — das meldet der
      # Wächter): der Zettel behauptet einen Bundes-Gesetzestext-Befund.
      # rot_grund=netz (nur die Zwei-Wochen-Grenze griff) ⇒ kein Gesetzestext-Zettel; das
      # trägt der Netz-Zettel unten.
      - name: Bei Rot — Aufgaben-Zettel anlegen (falls keiner offen)
        if: failure() && steps.netz.outcome == 'failure' && steps.netz.outputs.rot_grund != 'netz'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TAFEL: ${{ runner.temp }}/netz-tafel.md
        run: |
          set -euo pipefail
          trap 'echo "::warning::Zettel-Pflege gescheitert (Z. $LINENO), Lauf unberührt"; exit 0' ERR
          offen=$(gh api "repos/$GITHUB_REPOSITORY/issues?labels=alarm:normen-monitor&state=open&creator=github-actions%5Bbot%5D" -q '[.[]|select(.pull_request|not)][0].number // empty')
          if [ -n "$offen" ]; then echo "Zettel #${offen} ist offen — kein neuer."; exit 0; fi
          tafel=$( [ -f "$TAFEL" ] && cat "$TAFEL" || echo "(Tafel fehlt — Lauf-Log lesen)")
          rumpf="Gespeicherter Bundes-Gesetzestext weicht von der amtlichen Fassung ab (oder ein Zitat zeigt ins Leere). Vor jeder Handarbeit: offene Bot-PRs prüfen (Fedlex-Frische re-pinnt überholte Fassungen selbst). Lauf: ${RUN_URL}

          ${tafel}"
          for l in "--label alarm:normen-monitor" ""; do
            gh issue create $l --title "🔴 Normen-Monitor rot ($(date +%F)) — Bundes-Gesetzestext prüfen (§7)" --body "$rumpf" && break
          done

      # Netz-Zettel (EIN Zettel, Label alarm:normen-monitor-netz): unvollständig ⇒ anlegen bzw.
      # kommentieren; vollständig ⇒ schliessen. Ohne Label findet die nächste Abfrage ihn
      # nicht — darum Label zuerst sicherstellen und KEIN Rückfall auf einen label-losen Zettel.
      # FAIL-SAFE (Gegenprüfung Runde 2, 5.10.2026, Nebenfund A): scheitert die Zettel-Pflege,
      # wird der Lauf ROT statt nur gewarnt — ohne Netz-Zettel startet die Zwei-Wochen-Grenze
      # nie, der Monitor bliebe dauerhaft blind ohne Rot.
      - name: Netz unvollständig — Netz-Zettel anlegen oder kommentieren
        if: always() && steps.netz.outputs.netz_unvollstaendig == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NR: ${{ steps.netzzettel.outputs.nummer }}
          ROT_GRUND: ${{ steps.netz.outputs.rot_grund }}
          TAFEL: ${{ runner.temp }}/netz-tafel.md
        run: |
          set -euo pipefail
          trap 'echo "::error::Netz-Zettel-Pflege gescheitert (Z. $LINENO) — ohne Netz-Zettel greift die Zwei-Wochen-Grenze nie, darum Lauf ROT (fail-safe)"; exit 1' ERR
          tafel=$( [ -f "$TAFEL" ] && cat "$TAFEL" || echo "(Tafel fehlt — Lauf-Log lesen)")
          if [ -n "$NR" ]; then
            # Wortlaut nach rot_grund (Nebenfund B): Gesetzestext-Rot trägt der Alarm-Zettel.
            if [ "$ROT_GRUND" = "gesetzestext" ]; then
              wie="Lauf ROT wegen eines Bundes-Gesetzestext-Befunds (Alarm-Zettel alarm:normen-monitor); die Zwei-Wochen-Grenze ist zusätzlich erreicht"
            else
              wie="Lauf ROT (Zwei-Wochen-Grenze)"
            fi
            gh issue comment "$NR" --body "Erneut unvollständig am $(date +%F) — ${wie}. Lauf: ${RUN_URL}

          ${tafel}"
            exit 0
          fi
          gh label create alarm:normen-monitor-netz --color FBCA04 --description "Normen-Monitor: Bundes-Gesetzestext-Quelle nicht erreichbar (normen-monitor.yml)" >/dev/null 2>&1 || true
          gh issue create --label alarm:normen-monitor-netz --title "🟠 Normen-Monitor unvollständig ($(date +%F)) — Bundes-Gesetzestext-Quelle nicht erreichbar" --body "Mindestens ein Bundes-Gesetzestext-Tor lieferte auch nach Wiederholung Exit 2 (keine Aussage). Bleibt das im nächsten Wochenlauf so, wird der Monitor ROT. Quelle/Endpunkt prüfen (§8). Lauf: ${RUN_URL}

          ${tafel}"

      - name: Netz vollständig — Netz-Zettel schliessen
        if: always() && steps.netz.outputs.netz_unvollstaendig == '0' && steps.netzzettel.outputs.nummer != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NR: ${{ steps.netzzettel.outputs.nummer }}
        run: |
          set -euo pipefail
          trap 'echo "::warning::Netz-Zettel-Pflege gescheitert (Z. $LINENO), Lauf unberührt"; exit 0' ERR
          gh issue close "$NR" --reason completed --comment "🟢 Bundes-Gesetzestext-Tore am $(date +%F) wieder vollständig geprüft. Lauf: ${RUN_URL}"

      # Gegenstück: bei Grün (= kein Bundes-Gesetzestext-Befund) den offenen Zettel schliessen (§8) —
      # NUR bei vollständigem Lauf: ein blindes Tor ist keine Entwarnung (Befund 1, 5.10.2026).
      - name: Bei Grün — offenen Aufgaben-Zettel schliessen
        if: success() && steps.netz.outputs.netz_unvollstaendig != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          trap 'echo "::warning::Zettel-Pflege gescheitert (Z. $LINENO), Lauf unberührt"; exit 0' ERR
          offen=$(gh api "repos/$GITHUB_REPOSITORY/issues?labels=alarm:normen-monitor&state=open&creator=github-actions%5Bbot%5D" -q '[.[]|select(.pull_request|not)][0].number // empty')
          if [ -z "$offen" ]; then echo "Monitor grün, kein offener Zettel."; exit 0; fi
          gh issue close "$offen" --reason completed --comment "🟢 Normen-Monitor grün am $(date +%F) — kein Bundes-Gesetzestext-Befund mehr. Lauf: ${RUN_URL}"
