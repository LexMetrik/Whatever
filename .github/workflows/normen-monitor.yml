# ─── Normen-Monitor: wöchentliche Wache über den GESETZESTEXT ───────────────
# (STRATEGIE-PLATTFORM.md F2.4 · QS-OPT O-1 · Rückbau MONITOR 5.10.2026)
#
# Entscheid David 5.10.2026: «wichtig ist gesetzestext. der rest muss nicht zu einem rot
# führen.» Darum zwei Klassen in EINEM Lauf (`npm run check:netz`, Runner
# scripts/run-netz-alle.ts — Klassen-Begründung dort):
#   • ROT + Alarm-Zettel nur, wenn gespeicherter Normtext/Pin von der amtlichen Fassung
#     abweicht oder ein Zitat ins Leere zeigt (`check:netz:kette`: caches · zitate ·
#     fedlex-versionen · normtext-netz · pdf-netz). Ein Kanonik-Wechsel ohne Textänderung
#     ist nur ein Hinweis (fedlex-frische.yml re-pinnt ihn von selbst); eine nicht
#     erreichbare Quelle (Exit 2) wird einmal wiederholt und bleibt sonst ein Hinweis.
#   • Alles andere (`check:netz:bericht`: Materialien, Revisionen, Abkürzungen, BE-Sprengel,
#     Tarif, FR/IT, Verfall, LIK) erscheint als Wochenbericht in der Lauf-Zusammenfassung
#     (::warning:: + Tafel), färbt den Lauf aber NICHT rot. Wo ein Generator existiert,
#     führen die Bots nach: normen-monatslauf.yml (Curia, BS-Grossrat, Vernehmlassungen)
#     und fedlex-frische.yml (Re-Pins, Revisionen); der Rest bleibt Handarbeit nach Bericht
#     (§7: Materialien-Snapshots, Fedlex-Abkürzungen, Tarif, LIK, Verfall).
# Gestrichen im Rückbau (nie ein echter Befund): Prod-Smoke-Duplikat (prod-smoke.yml prüft
# die Live-Site alle 6 h, inkl. der Korpus-JSONs), Runtime-API-Vertragstests, rss-oc,
# pdf-quellen-netz, vernehmlassungen-alter; ebenso die Eskalationsstufe des Zettels.
name: Normen-Monitor

on:
  schedule:
    # Montags 07:17 UTC — 2,5 h NACH dem Reparatur-Arm (fedlex-frische.yml, 04:43 UTC):
    # erst reparieren, dann messen (QS-MONITOR-ROT, 1.9.2026). Die Monatsläufe liegen seit
    # 1.10.2026 in normen-monatslauf.yml.
    - cron: '17 7 * * 1'
  workflow_dispatch:

env:
  # Zeitzone wie ci.yml: Verfallstermine (`check:verfall`) sind Kalendertage in Zürich.
  TZ: Europe/Zurich

jobs:
  normen:
    name: Gesetzestext (check:netz) · Wochenbericht
    runs-on: ubuntu-latest
    # Notbremse mit Reserve, nicht Taktgeber (Lauf 5.10.2026: ~25 min seriell).
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npx -y npm@11 ci

      - name: Gesetzestext rot · Rest Bericht — npm run check:netz
        id: netz
        env:
          NETZ_TAFEL_DATEI: ${{ runner.temp }}/netz-tafel.md
        run: npm run check:netz

      # EIN Zettel (Label alarm:normen-monitor): bei Rot anlegen, falls keiner offen ist;
      # kein Wiederhol-Kommentar (Leser ist die Startabfrage jeder Session:
      # gh issue list --state open --author "github-actions[bot]", Skill bauschritt).
      # ERR-Trap → Warnung statt Lauf-Rot (Zettel-Muster waechter.yml, 1.10.2026).
      # Nur bei rotem check:netz (nicht bei Infrastruktur-Rot wie `npm ci` — das meldet der
      # Wächter): der Zettel behauptet einen Gesetzestext-Befund.
      - name: Bei Rot — Aufgaben-Zettel anlegen (falls keiner offen)
        if: failure() && steps.netz.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TAFEL: ${{ runner.temp }}/netz-tafel.md
        run: |
          set -euo pipefail
          trap 'echo "::warning::Zettel-Pflege gescheitert (Z. $LINENO), Lauf unberührt"; exit 0' ERR
          offen=$(gh api "repos/$GITHUB_REPOSITORY/issues?labels=alarm:normen-monitor&state=open&creator=github-actions%5Bbot%5D" -q '[.[]|select(.pull_request|not)][0].number // empty')
          if [ -n "$offen" ]; then echo "Zettel #${offen} ist offen — kein neuer."; exit 0; fi
          tafel=$( [ -f "$TAFEL" ] && cat "$TAFEL" || echo "(Tafel fehlt — Lauf-Log lesen)")
          rumpf="Gespeicherter Gesetzestext weicht von der amtlichen Fassung ab (oder ein Zitat zeigt ins Leere). Vor jeder Handarbeit: offene Bot-PRs prüfen (Fedlex-Frische re-pinnt überholte Fassungen selbst). Lauf: ${RUN_URL}

          ${tafel}"
          for l in "--label alarm:normen-monitor" ""; do
            gh issue create $l --title "🔴 Normen-Monitor rot ($(date +%F)) — Gesetzestext prüfen (§7)" --body "$rumpf" && break
          done

      # Gegenstück: bei Grün (= kein Gesetzestext-Befund) den offenen Zettel schliessen (§8).
      - name: Bei Grün — offenen Aufgaben-Zettel schliessen
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          trap 'echo "::warning::Zettel-Pflege gescheitert (Z. $LINENO), Lauf unberührt"; exit 0' ERR
          offen=$(gh api "repos/$GITHUB_REPOSITORY/issues?labels=alarm:normen-monitor&state=open&creator=github-actions%5Bbot%5D" -q '[.[]|select(.pull_request|not)][0].number // empty')
          if [ -z "$offen" ]; then echo "Monitor grün, kein offener Zettel."; exit 0; fi
          gh issue close "$offen" --reason completed --comment "🟢 Normen-Monitor grün am $(date +%F) — kein Gesetzestext-Befund mehr. Lauf: ${RUN_URL}"
