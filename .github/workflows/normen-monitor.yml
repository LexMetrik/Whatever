# ─── Normen-Monitor: wöchentliche Wache über Rechtsstände UND die Live-Site ──
# (STRATEGIE-PLATTFORM.md F2.4 · QS-OPT O-1/O-2)
#
# Zwei Wach-Ebenen:
#  1. Rechtsstände (amtliche Quellen): `npm run check:netz` — die EINE Netz-Tor-
#     Kette (Fedlex-Caches, Zitate, Konsolidierungs-Versionen, RSS-OC-Stale-
#     Pending, Kantons-version_uid, ZH-Registry-Pins gegen die amtliche Suche
#     [zh-quellen-aufloesen Prüfmodus, B3 31.8.2026: eine alte Registry-Seite
#     liefert ewig HTTP 200 + altes PDF — ein NEUER Nachtrag bliebe dem
#     Hash-Drift-Tor sonst unsichtbar], PDF-Erreichbarkeit, PDF-Quellen,
#     Materialien-, Botschaften-, Revisionen- (seit W2·18-FEHLERBUCH inkl. der
#     rectifies-Ziel-Gegenprobe `check:revisionen-rectifies` — Berichtigungstext
#     vs. das amtliche jolux:rectifies-Tripel), Vernehmlassungs- und
#     Fedlex-Abkürzungs-Drift).
#     Vorher liefen nur 6 von 10 Toren einzeln (O-1.3) — Abdeckung ist jetzt
#     = `check:netz` per Konstruktion.
#     `check:rss-oc` kam am 7.8.2026 dazu (QS-SELBSTOPT, Ent-Regulierung): es war
#     das einzige Netz-Tor AUSSERHALB der Kette und machte die Vollständigkeits-
#     Behauptung dieses Kopfes still falsch. Es lief nirgends, obwohl es genau die
#     Lücke schliesst, die `check:fedlex-versionen` bauartbedingt nicht sieht:
#     ein AS-Akt ist in Kraft, die Konsolidierung hinkt nach — in diesem Fenster
#     servieren wir veraltetes Recht ohne Flag.
#  2. Die Live-Site selbst (O-1.2): Prod-Smoke gegen lexmetrik.vercel.app —
#     Startseite, /api/suche, je 1 Stichproben-JSON pro Korpus, Soft-404-Signal.
#     Plus Vertragstests der Runtime-APIs Zefix/geo.admin.ch (O-1.8) und das
#     LIK-Frische-Tor (O-1.6). Bisher prüfte der Monitor NIE die Site selbst —
#     ein totes Feature (CSP frisst LiveSuche) blieb so wochenlang unbemerkt.
#
# Schlägt ein Schritt fehl, ist ein gepinnter Stand überholt, ein Anker weg, eine
# amtliche Quelle nicht erreichbar ODER die Live-Site/eine Runtime-API defekt →
# sichtbarer Aufgaben-Zettel (§7-Verifikation bzw. Betriebs-Fix).
name: Normen-Monitor

on:
  schedule:
    # Montags 07:17 UTC — seit 1.9.2026 2,5 h NACH dem Reparatur-Arm (fedlex-frische.yml,
    # 04:43 UTC). Verfahrens-Gap QS-MONITOR-ROT: bei 05:17 lief der Detektor 34 min nach
    # dem Reparatur-Lauf, dessen PR (CI ≈ 15 min + Auto-Merge) noch nicht auf main war —
    # der Monitor meldete den Pin rot, den der Reparatur-Arm schon gehoben hatte (24.8.:
    # 10 Pins, 31.8.: StGB). Reihenfolge-Entscheid: erst reparieren, dann messen; der
    # Detektor prüft main, nicht den Reparatur-Branch.
    - cron: '17 7 * * 1'
    # MONATSLAUF Curia Vista (W2·6c E4, FAHRPLAN-MATERIALIEN-VERZAHNUNG §11.6, Kritik B3).
    # Bewusst NICHT in der Gate-Kette: ~8 Anfragen je Geschäft über ~400 Geschäfte bei
    # <=2 Anfragen/s sind ~27 min — das ist keine Zahl, die vor einen Merge gehört, und
    # ein Delta-Sync ist nicht möglich (`Modified` trug am 10.2.2026 für verschiedene
    # Geschäfte denselben Zeitstempel = systemweiter Reindex, R4 §5). Erster des Monats,
    # 03:23 UTC — vor dem Reparatur-Arm (04:43) und dem Detektor (07:17), damit ein
    # Curia-PR nicht mit deren Läufen um dieselben Dateien streitet.
    - cron: '23 3 1 * *'
    # MONATSLAUF BS-Grossratsgeschäfte (K-16, W2·13-KANTONE-DATEN). Eigener Job aus
    # demselben Grund wie Curia: der Abgleich lädt drei Vollexporte von data.bs.ch
    # (~31 MB, ~40 s) — das gehört nicht vor einen Merge, sondern einmal im Monat.
    # Erster des Monats, 03:47 UTC: nach dem Curia-Lauf (03:23, andere Dateien, aber
    # derselbe Branch-Raum) und vor dem Reparatur-Arm (04:43).
    - cron: '47 3 1 * *'
    # MONATSLAUF Vernehmlassungs-Register (§17-Wurzelfix, ex-Finding-7-Wanduhr-Befund
    # 5./12.9.2026, FAHRPLAN-OFFENE-BEFUNDE §2 QS-MONITOR-ROT). Der Vernehmlassungs-
    # Generator lief bisher NUR von Hand — der Erhebungsstand (`stand` in
    # vernehmlassungen.generated.ts) alterte unbemerkt, bis check:materialien
    # (Finding 7, damals wanduhr-abhängig) an jedem Tag mit abgelaufener Frist rot
    # wurde, ohne dass ein Bau daran schuld war. Jetzt deterministisch (Finding 7
    # prüft gegen den committeten `stand`, nicht gegen heute) PLUS dieser Kreislauf,
    # der den Stand selbst aktuell hält. Erster des Monats, 04:11 UTC: nach BS (03:47)
    # und vor dem Reparatur-Arm (04:43) — dieselbe Reihenfolge-Überlegung wie oben.
    - cron: '11 4 1 * *'
  workflow_dispatch:

env:
  PROD_URL: https://lexmetrik.vercel.app
  # Zeitzone wie in ci.yml (dort mit Begründung, Zeilen 79–83): GitHub-Runner
  # laufen in UTC, die Schweizer Rechtsstände und die datumsabhängigen Tore
  # rechnen aber wie die Nutzer. Betrifft hier `check:verfall` (Zeile 52) —
  # Verfallstermine sind Kalendertage, und ein UTC-Runner kippt sie im Fenster
  # zwischen 22:00/23:00 und Mitternacht Zürich einen Tag zu früh bzw. zu spät.
  # Nachtrag 26.7.2026: dieselbe fehlende Zeile war in fedlex-frische.yml die
  # Ursache eines strukturell garantierten Fehlschlags (dort dokumentiert).
  TZ: Europe/Zurich

jobs:
  normen:
    name: Rechtsstände (check:netz) · Live-Site-Smoke · Runtime-APIs
    runs-on: ubuntu-latest
    # 45 statt 25 seit 18.9.2026 (§17): der Netz-Lauf ist seriell und wächst mit dem Korpus —
    # 5.9. grün in 22 min, 14.9. bei 25 min mitten in `check:be-sprengel-netz` abgewürgt
    # (Lauf 34853464780: caches 4 min · normtext-netz 10 min · materialien-netz 8 min).
    # `cancelled` färbt GitHub grau, der Wächter meldet es rot. Das Limit ist Notbremse mit
    # Reserve, nicht Taktgeber (gleiche Regel wie turso-sync.yml); reisst der Lauf 35 min,
    # ist der Zeitfresser zu messen, nicht das Limit erneut zu heben.
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
      # `actions: read` seit 3.8.2026 — die Eskalationsstufe unten zählt die
      # vorangehenden Läufe dieses Workflows (`gh run list`).
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npx -y npm@11 ci

      # ── 1. Rechtsstände: die EINE Netz-Tor-Kette (O-1.3) ────────────────────
      - name: Rechtsstände — npm run check:netz (alle Netz-Tore, Zahl druckt der Runner)
        run: npm run check:netz

      # ── Verfalls-/Frische-Tore (nicht in check:netz, wanduhr-abhängig) ──────
      #
      # SEIT 3.8.2026 (K7) ist das hier der PRIMÄRE Laufort von check:verfall:
      # aus dem PR-Pfad (ci.yml, Job `tore`) wurde es entfernt, weil ein
      # wanduhr-abhängiges Tor dort schlagartig alle offenen PRs rot färbt, die
      # nichts damit zu tun haben (Lauf 30764225649 vom 2.8.2026). Der WÖCHENT-
      # LICHE Takt ist der richtige: ein Registertermin ist ein Rechtsstands-
      # Befund, kein Diff-Befund, und gehört zu den übrigen §7-Wachen.
      #
      # VORLAUF-WARNUNG ist eingebaut und braucht kein Flag: verfall-pruefen.ts
      # druckt jeden Termin der nächsten VORLAUF_TAGE (= 45, Zeile ~35) als
      # «FÄLLIG <Datum> <Label>» und zählt sie am Ende. Damit sieht dieser Lauf
      # kommende Verfälle rund sechs Wochen im Voraus — deutlich mehr als der
      # ursprünglich vorgesehene 14-Tage-Vorlauf, darum wurde die Schwelle NICHT
      # angefasst (sie ist zudem bewusst mit VerfallUebersicht.tsx gespiegelt).
      # `if: always()` bleibt: das Tor muss auch laufen, wenn check:netz oben
      # bereits rot war — sonst verdeckt ein Netzfehler den Verfall.
      - name: Verfallsregister (Termine · mit Vorlauf-Warnung ≤45 Tage)
        if: always()
        run: npm run check:verfall

      # Derselbe K7-Platz wie check:verfall oben (§17-Wurzelfix PR #803, Gegenprüfungs-
      # Auflage A1): der Alterungs-Wächter des Vernehmlassungs-Registers ist wanduhr-
      # abhängig und darf darum NICHT in check-materialien.ts hängen — dort würde er
      # fachfremde Aufrufer (z. B. den Job `bs-grossrat` unten) vor deren PR-Schritt
      # töten. Sein einziger Aufrufer ist dieser wöchentliche Detektor. `if: always()`
      # aus demselben Grund wie oben — ein Netzfehler soll den Alterungs-Befund nicht
      # verdecken. Begründung ausführlich: scripts/materialien/vernehmlassungen-tor.ts.
      - name: Vernehmlassungs-Register-Alter (Wächter, verhindert keinen Merge)
        if: always()
        run: npm run check:vernehmlassungen-alter
      - name: LIK-Reihe frisch (BFS-Monatsindex, O-1.6)
        if: always()
        run: npm run check:lik-frische

      # ── 2. Live-Site-Prod-Smoke (O-1.2 + O-1.4 Soft-404-Signal) ─────────────
      - name: Prod-Smoke — Live-Site (Startseite, /api/suche, Korpus-JSON, Soft-404)
        if: always()
        run: bash .github/scripts/prod-smoke.sh

      # ── 2b. Vertragstests Runtime-APIs Zefix / geo.admin.ch (O-1.8) ─────────
      - name: Runtime-API-Vertragstests (Zefix + geo.admin.ch)
        if: always()
        run: bash .github/scripts/api-vertragstests.sh

      # ── 3. FR/IT-Drift Stufe 1 (QS-FRIT-DRIFT, 15.8.2026) ──────────────────
      #
      # Bis hierher prüft dieser Monitor ausschliesslich die DEUTSCHE Fassung —
      # eine französische oder italienische Fassung konnte beliebig abweichen,
      # ohne dass ein Tor es sah. `check:frit-drift` vergleicht je Kern-Erlass
      # die eId-Mengen der drei Amtssprachen AM GEPINNTEN Stand und meldet
      # Abweichungen (Details: scripts/fedlex-frit-drift.ts).
      #
      # Der Exit-2-Fall wird bewusst NICHT rot: Exit 2 heisst «Fedlex/Filestore
      # nicht erreichbar, keine Aussage möglich» — das ist kein Rechtsstands-
      # Befund, und ein Rot dafür würde denselben Alarm entwerten, den die
      # Triage unten scharf halten soll. Er wird als ::warning:: annotiert, ist
      # also sichtbar und nicht still (§6.7); lokal bleibt der Exit-Code 2.
      # Exit 1 (echte Sprach-Drift) färbt den Lauf rot — `continue-on-error`
      # bleibt deshalb false.
      - name: FR/IT-Drift Stufe 1 (eId-Mengenvergleich DE/FR/IT, Kern-Erlasse)
        if: always()
        continue-on-error: false
        run: |
          set -uo pipefail
          # `set +e` ist nötig: GitHub startet `run:`-Blöcke mit `bash -e`, und
          # -e würde den Lauf beim Exit-Code 2 abbrechen, BEVOR die Netz-Warnung
          # unterschieden werden kann. Der Exit-Code wird unverändert
          # weitergereicht (nie durch Pipe/|| verschluckt, §6-Lehre 6./7.6.).
          set +e
          npm run check:frit-drift
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            echo "::warning title=FR/IT-Drift unvollständig::Fedlex/Filestore nicht vollständig erreichbar — kein Sprachvergleich möglich (kein Drift-Befund, kein Grün)."
            exit 0
          fi
          exit "$code"

      # A2 (2.7.2026): Ein roter Lauf verhallte bisher still in der Verlaufsliste (15.6./29.6.
      # real rot, unbemerkt). Bei Rot legen wir einen sichtbaren Aufgaben-Zettel an — ODER
      # kommentieren den bestehenden, damit keine Issue-Flut entsteht.
      #
      # ── TRIAGE-NACHZUG (3.8.2026, Fehlerklasse K5) ──────────────────────────
      # Die Kommentar-Sammelstelle hat ihr Ziel verfehlt: Issue #166 (angelegt
      # 6.7.2026) trug am 3.8. vier Kommentare — «Erneut rot am …», immer
      # derselbe Text, nie geschlossen, nie eskaliert. Ein Alarm, der sich vier
      # Wochen lang unverändert wiederholt, ist kein Alarm mehr, sondern
      # Rauschen; die 8 nicht-kanonischen Pins standen genau in dieser Zeit.
      # Zwei Ergänzungen, beide gegen dieselbe Wurzel:
      #   (1) Bei GRÜN wird der Zettel GESCHLOSSEN. Ohne Schliessung sagt ein
      #       offener Zettel nichts mehr über die Gegenwart aus — er ist dann
      #       nur noch ein Beleg, dass es einmal ein Problem gab.
      #   (2) Ab dem 3. roten Lauf IN FOLGE bekommt der Titel das Präfix
      #       «ESKALATION:». Der Unterschied zwischen «einmal rot» (Quelle
      #       kurz weg) und «dauerhaft rot» (echter Rechtsstands-Defekt) muss
      #       im Titel stehen, nicht im vierten Kommentar.
      - name: Bei Rot — sichtbaren Aufgaben-Zettel anlegen/aktualisieren/eskalieren
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          offen=$(gh issue list --state open --search 'Normen-Monitor rot in:title' --json number --jq '.[0].number // empty')
          rumpf="Der wöchentliche Normen-Monitor ist fehlgeschlagen — ein gepinnter Rechtsstand ist möglicherweise überholt, ein Anker weg, eine amtliche Quelle nicht erreichbar ODER die Live-Site/eine Runtime-API defekt. Prüfen: **§7-Verifikation** (Pins/Wortlaute/Verfallsregister) bzw. **Betriebs-Fix** (Site/API). Lauf: ${RUN_URL}"

          # Rot-Serie zählen: abgeschlossene Vorläufer, solange sie NICHT
          # 'success' sind. 'cancelled'/'timed_out' brechen die Serie NICHT —
          # ein grauer Lauf ist kein bestandener Lauf (CLAUDE.md §6 Ziff. 7
          # lit. c, dieselbe Regel wie in check:ci-laeufe). Der laufende Lauf
          # ist noch nicht 'completed', darum zählt er als +1.
          serie=1
          for c in $(gh run list --workflow normen-monitor.yml --limit 15 \
                       --json conclusion,status \
                       --jq '.[] | select(.status=="completed") | .conclusion'); do
            [ "$c" = "success" ] && break
            serie=$((serie + 1))
          done
          echo "Rot-Serie in Folge (inkl. diesem Lauf): ${serie}"

          if [ -n "$offen" ]; then
            gh issue comment "$offen" --body "Erneut rot am $(date +%F) — ${serie}. roter Lauf in Folge. ${rumpf}"
            nr="$offen"
          else
            nr=$(gh issue create --title "🔴 Normen-Monitor rot ($(date +%F)) — Rechtsstand/Site prüfen (§7/Betrieb)" --body "$rumpf" | grep -oE '[0-9]+$')
          fi

          if [ "$serie" -ge 3 ]; then
            titel=$(gh issue view "$nr" --json title --jq '.title')
            case "$titel" in
              ESKALATION:*) echo "Zettel #${nr} ist bereits eskaliert — Titel unverändert." ;;
              *)
                gh issue edit "$nr" --title "ESKALATION: ${titel}"
                gh issue comment "$nr" --body "**Eskalationsstufe erreicht**: ${serie} rote Läufe in Folge. Das ist kein Aussetzer einer amtlichen Quelle mehr, sondern ein stehender Befund — §7-Verifikation ist fällig."
                echo "Zettel #${nr} eskaliert (${serie} rote Läufe in Folge)."
                ;;
            esac
          fi

      # Gegenstück zur Triage: bei GRÜN wird der Zettel geschlossen. Ein
      # Monitor, der nur anlegt und nie schliesst, produziert eine Liste, die
      # nur wächst — und über die Gegenwart nichts mehr aussagt (§8).
      - name: Bei Grün — offenen Aufgaben-Zettel schliessen
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          offen=$(gh issue list --state open --search 'Normen-Monitor rot in:title' --json number --jq '.[0].number // empty')
          if [ -z "$offen" ]; then
            echo "Monitor grün, kein offener Zettel — nichts zu schliessen."
            exit 0
          fi
          gh issue close "$offen" --reason completed --comment "🟢 Normen-Monitor wieder grün am $(date +%F) — alle Netz-Tore, Live-Site und Runtime-APIs bestanden. Zettel geschlossen; bei erneutem Rot legt der Monitor einen neuen an. Lauf: ${RUN_URL}"
          echo "Zettel #${offen} geschlossen (Monitor grün)."

  # ── Curia-Vista-Monatslauf (W2·6c E4) ─────────────────────────────────────────
  # Eigener Job, NICHT im Detektor-Job: er schreibt (Shards + Zustandsträger) und
  # braucht darum andere Rechte und ein anderes Zeitbudget. Er läuft nur am
  # Monats-Cron oder auf Zuruf — der wöchentliche Detektor bleibt unberührt.
  curia:
    name: Curia Vista — Monats-Vollabgleich (Parlaments-Etappen)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 3 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Europe/Zurich
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # npm 11 wie überall sonst (18.9.2026, §17): das bare `npm ci` des Runners (npm 10) bricht am
      # npm-11-Lockfile mit EUSAGE ab — Lauf 35353185468, alle drei Monats-Jobs rot nach < 1 min.
      - run: npx -y npm@11 ci
      - name: Abrufdatum (Zürich, nie Date.now im Generator)
        id: datum
        run: echo "iso=$(date +%F)" >> "$GITHUB_OUTPUT"
      - name: Vollabgleich Curia Vista (Beschlüsse · Kommissionen · NR-Aggregat)
        run: npm run materialien:curia -- --datum=${{ steps.datum.outputs.iso }}
      # §17-Wurzelfix (QS-MONITOR-ROT, Rot-Beleg Lauf 35373415150, 18.9.2026): die
      # Curia-Shards sind eine Quelle der Deckungs-Sicht (deckung-projektion-quellen.ts,
      # CURIA_DIR) — ohne diesen Nachzug meldete `check:entstehung` Ziff. 7 «1 Abweichung
      # zur Neuberechnung», weil `public/materialien/deckungs-sicht.json` nie neu gebaut
      # wurde. Dieselbe Teilkaskade wie `materialien:kaskade` (§5, EINE Glieder-Liste,
      # scripts/entstehung/projektion-kaskade.ts) — schreibt am Ende auch das
      # Datenhaltungs-Manifest, darum kein separater `datenhaltung:manifest`-Schritt mehr.
      - name: Entstehungs-/Deckungs-Projektion nachziehen (Teilkaskade)
        run: npm run entstehung:projektion-kaskade
      - name: Offline-Tore auf dem frischen Stand
        run: npm run check:entstehung && npm run check:datenhaltung
      - name: Änderungen feststellen
        id: diff
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then echo "geaendert=1" >> "$GITHUB_OUTPUT"; else echo "geaendert=0" >> "$GITHUB_OUTPUT"; fi
      - name: PR eröffnen (NIE Auto-Merge — Risikopfad, Gegenprüfung nachgelagert)
        if: steps.diff.outputs.geaendert == '1'
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
          DATUM: ${{ steps.datum.outputs.iso }}
        run: |
          set -euo pipefail
          branch="chore/curia-monatslauf-${DATUM}"
          git config user.name  "curia-monatslauf-bot"
          git config user.email "noreply@anthropic.com"
          git checkout -b "$branch"
          git add -A
          git commit -F - <<'EOF'
          chore(entstehung): Curia-Vista-Monatslauf — Parlaments-Etappen nachgeführt

          Automatischer Vollabgleich gegen ws.parlament.ch (OData v3). Quelle:
          Parlamentsdienste der Bundesversammlung, Bern. Keine Personendaten
          (weder gespeichert noch abgefragt), Stimmenzahlen nur aggregiert und
          als eigene Auszaehlung beschriftet.

          Roadmap: W2·6c-ENTSTEHUNG-DATEN
          Gegenpruefung: ausstehend — automatischer Lauf, adversariale Pruefung nachgelagert
          Co-Authored-By: Claude Opus 5 (1M context) <noreply@anthropic.com>
          EOF
          git push -u origin "$branch"
          offen=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$offen" ]; then
            echo "PR #${offen} für ${branch} ist bereits offen (idempotent)."
          else
            gh pr create --base main --head "$branch" \
              --title "chore(entstehung): Curia-Vista-Monatslauf ${DATUM}" \
              --body "Automatischer Monats-Vollabgleich der Parlaments-Etappen (W2·6c E4). KEIN Auto-Merge: die Curia-Shards liegen auf dem Risikopfad (istRisikoPfad), die adversariale Gegenpruefung ist nachgelagert."
          fi

  bs-grossrat:
    name: Basel-Stadt — Monats-Vollabgleich (Grossratsgeschäfte)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '47 3 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Zurich
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npx -y npm@11 ci  # s. Job `curia`: bares `npm ci` bricht am npm-11-Lockfile
      - name: Abrufdatum (Zürich, nie Date.now im Generator)
        id: datum
        run: echo "iso=$(date +%F)" >> "$GITHUB_OUTPUT"
      - name: Vollabgleich data.bs.ch (Geschäfte · Dokumente · Gesetzessammlung)
        run: npm run materialien:bs -- --datum=${{ steps.datum.outputs.iso }}
      - name: Projektion auf dem frischen Stand
        run: npm run materialien -- --datum=${{ steps.datum.outputs.iso }}
      # §17-Wurzelfix (QS-MONITOR-ROT, 19.9.2026, Beleg: lokale Simulation mit
      # --datum=morgen, Bericht der Bau-Session): `materialien` schreibt bei JEDEM Lauf
      # `register-provenienz.json#erzeugt` neu — unabhängig davon, ob sich ein Eintrag
      # inhaltlich ändert (material-manifest.ts `provenienz: { erzeugt: voll.erzeugt }`).
      # Dieses Feld geht UNGEFILTERT in `deckungs-sicht.json` ein (deckung-projektion.ts
      # `staende.provenienz` + `ebenen.verfahrenBund/verfahrenBs/zh.stand`) — ohne
      # Nachzug wird `check:entstehung` beim nächsten PR rot, sobald dieser Lauf nicht
      # zufällig denselben Kalendertag trifft wie die letzte Deckungs-Projektion (genau
      # dieselbe Fehlerklasse wie im Job `curia`, hier über eine andere Quelle). Ersetzt
      # die frühere separate «Zähler nachziehen» + den Schreib-Teil von «Datenhaltungs-
      # Manifest» — dieselbe Teilkaskade wie im Job `curia` (§5, EINE Glieder-Liste).
      - name: Entstehungs-/Deckungs-Projektion + Zähler + Manifest nachziehen (Teilkaskade)
        run: npm run entstehung:projektion-kaskade
      - name: Offline-Tore auf dem frischen Stand
        run: npm run check:bs-materialien && npm run check:materialien && npm run check:datenhaltung
      - name: Änderungen feststellen
        id: diff
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then echo "geaendert=1" >> "$GITHUB_OUTPUT"; else echo "geaendert=0" >> "$GITHUB_OUTPUT"; fi
      - name: PR eröffnen (NIE Auto-Merge — Risikopfad, Gegenprüfung nachgelagert)
        if: steps.diff.outputs.geaendert == '1'
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
          DATUM: ${{ steps.datum.outputs.iso }}
        run: |
          set -euo pipefail
          branch="chore/bs-grossrat-monatslauf-${DATUM}"
          git config user.name  "bs-grossrat-monatslauf-bot"
          git config user.email "noreply@anthropic.com"
          git checkout -b "$branch"
          git add -A
          git commit -F - <<'EOF'
          chore(materialien): BS-Grossrat-Monatslauf — kantonale Materialien nachgefuehrt

          Automatischer Vollabgleich gegen data.bs.ch (OpenDataSoft Explore v2.1,
          CC BY 4.0). Quelle: Kanton Basel-Stadt. Keine Personendaten — die
          Abfrage waehlt die erlaubten Felder einzeln an, Namen und Parteien der
          Vorstoss-Urheber werden nicht geholt.

          Roadmap: W2·13-KANTONE-DATEN
          Gegenpruefung: ausstehend — automatischer Lauf, adversariale Pruefung nachgelagert
          Co-Authored-By: Claude Opus 5 (1M context) <noreply@anthropic.com>
          EOF
          git push -u origin "$branch"
          offen=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$offen" ]; then
            echo "PR #${offen} für ${branch} ist bereits offen (idempotent)."
          else
            gh pr create --base main --head "$branch" \
              --title "chore(materialien): BS-Grossrat-Monatslauf ${DATUM}" \
              --body "Automatischer Monats-Vollabgleich der Basler Grossratsgeschaefte (K-16). KEIN Auto-Merge: die Materialien-Artefakte liegen auf dem Risikopfad (istRisikoPfad), die adversariale Gegenpruefung ist nachgelagert."
          fi

  vernehmlassungen:
    name: Vernehmlassungs-Register — Monatslauf (Erhebungsstand nachführen)
    # §17-Wurzelfix (FAHRPLAN-OFFENE-BEFUNDE §2 QS-MONITOR-ROT, Befund 5./12.9.2026):
    # check:materialien Finding 7 prüft seither deterministisch gegen den committeten
    # `stand` (Erhebungsdatum) statt gegen die Wanduhr — das reicht aber nur, wenn der
    # Erhebungsstand selbst regelmässig nachgeführt wird (dafür der Alterungs-Wächter
    # im selben Tor, 35-Tage-Deckel). Dieser Job ist der Kreislauf, der ihn frisch hält.
    # Eigener Job wie Curia/BS: er schreibt (generierte Datei + Projektion + Zähler)
    # und braucht Schreibrechte; läuft nur am Monats-Cron oder auf Zuruf.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '11 4 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Zurich
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npx -y npm@11 ci  # s. Job `curia`: bares `npm ci` bricht am npm-11-Lockfile
      - name: Abrufdatum (Zürich, nie Date.now im Generator)
        id: datum
        run: echo "iso=$(date +%F)" >> "$GITHUB_OUTPUT"
      - name: Vernehmlassungs-Generator (Fedlex-Gesetzgebungs-Graph, SPARQL)
        run: npm run materialien:vernehmlassungen -- --datum=${{ steps.datum.outputs.iso }}
      - name: Projektion auf dem frischen Stand
        run: npm run materialien -- --datum=${{ steps.datum.outputs.iso }}
      # §17-Wurzelfix — dieselbe Lücke und derselbe Nachzug wie im Job `bs-grossrat`
      # oben (Begründung dort): `materialien` bumpt register-provenienz.json#erzeugt bei
      # jedem Lauf, was ungeprüft in deckungs-sicht.json einginge.
      - name: Entstehungs-/Deckungs-Projektion + Zähler + Manifest nachziehen (Teilkaskade)
        run: npm run entstehung:projektion-kaskade
      - name: Offline-Tore auf dem frischen Stand (Finding 7 + Alterungs-Wächter)
        run: npm run check:materialien && npm run check:datenhaltung
      - name: Änderungen feststellen
        id: diff
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then echo "geaendert=1" >> "$GITHUB_OUTPUT"; else echo "geaendert=0" >> "$GITHUB_OUTPUT"; fi
      - name: PR eröffnen (NIE Auto-Merge — Risikopfad, Gegenprüfung nachgelagert)
        if: steps.diff.outputs.geaendert == '1'
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
          DATUM: ${{ steps.datum.outputs.iso }}
        run: |
          set -euo pipefail
          branch="chore/vernehmlassungen-monatslauf-${DATUM}"
          git config user.name  "vernehmlassungen-monatslauf-bot"
          git config user.email "noreply@anthropic.com"
          git checkout -b "$branch"
          git add -A
          git commit -F - <<'EOF'
          chore(materialien): Vernehmlassungs-Monatslauf — Erhebungsstand nachgeführt

          Automatischer Vollabgleich gegen den Fedlex-Gesetzgebungs-Graphen (SPARQL,
          data.admin.ch). Quelle: Bundeskanzlei/Fedlex. Hält den Erhebungsstand
          (`stand`) der Vernehmlassungen frisch, gegen den check:materialien
          Finding 7 deterministisch prüft (§17-Wurzelfix, FAHRPLAN-OFFENE-BEFUNDE §2
          QS-MONITOR-ROT) — verhindert den Alterungs-Wächter-Rotlauf (35-Tage-Deckel).

          Roadmap: QS-MONITOR-ROT
          Gegenpruefung: ausstehend — automatischer Lauf, adversariale Pruefung nachgelagert
          Co-Authored-By: Claude Opus 5 (1M context) <noreply@anthropic.com>
          EOF
          git push -u origin "$branch"
          offen=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$offen" ]; then
            echo "PR #${offen} für ${branch} ist bereits offen (idempotent)."
          else
            gh pr create --base main --head "$branch" \
              --title "chore(materialien): Vernehmlassungs-Monatslauf ${DATUM}" \
              --body "Automatischer Monats-Vollabgleich des Vernehmlassungs-Registers (Fedlex-Gesetzgebungs-Graph). KEIN Auto-Merge: die Materialien-Artefakte liegen auf dem Risikopfad (istRisikoPfad), die adversariale Gegenpruefung ist nachgelagert."
          fi
