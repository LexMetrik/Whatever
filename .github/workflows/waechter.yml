# .github/workflows/waechter.yml — Wächter über die geplanten Workflows (F2c).
#
# WARUM EIN EIGENER, ZEITGESTEUERTER WORKFLOW:
# Der Ausfall, den dieses Tor fängt, ist definitionsgemäss einer, den niemand
# bemerkt. `turso-sync.yml` lief 13.–20.7.2026 sechsmal in den Timeout und
# endete `cancelled` — GitHub färbt das GRAU, nicht rot. `normen-monitor.yml`
# hatte am 20.7.2026 seinen letzten Erfolg am 22.6., also vier Wochen davor.
# Beides fiel nur auf, weil dieses Tor gebaut wurde.
#
# Der Wächter darf darum NICHT an `ci.yml` hängen: ein PR-getriebenes Tor
# meldet nur, wenn jemand einen PR fährt. Der Auslöser muss die ZEIT sein.
#
# Er läuft bewusst NICHT in `check:seriell`: sein Befund betrifft den Zustand
# der Automatik auf `main`, nicht die Korrektheit eines Arbeitsbaums. Ein
# kaputter Wochen-Job soll den lokalen Bau nicht blockieren — er soll sichtbar
# sein. Sichtbarkeit stellt dieser Workflow her (rot in der Actions-Liste).
name: Wächter (geplante Läufe)

on:
  schedule:
    - cron: '11 6 * * *' # täglich 06:11 UTC — nach den 04:43/05:17-Jobs
  # Rückbau 19.9.2026 (QS-ORG-UMZUG): Auslöser `push: branches: [main]`, der Job
  # `autozug` (BEHIND-Nachzug per `gh pr update-branch`) und das dazugehörige
  # `if: github.event_name != 'push'` am Job `laeufe` ersatzlos gestrichen — seit
  # dem Org-Umzug serialisiert die native Merge-Queue auf main (Ruleset 23699779)
  # und zieht den Zweig selbst nach; ein BEHIND-Rennen kann es nicht mehr geben.
  workflow_dispatch:

permissions:
  # `actions: write` seit 3.8.2026 — nötig für `gh workflow run` im
  # Kontext-Nachzug unten (K2/K11). `read` würde für die Lauf-Abfrage reichen.
  actions: write
  contents: read
  checks: read
  pull-requests: read
  statuses: read
  # `issues: write` seit 14.8.2026 (Aktivierungs-Audit) — für die Selbstmeldung
  # unten (Muster normen-monitor.yml). Vorher hatte dieser Workflow als
  # einziger geplanter Wächter KEINE Issue-Eskalation: er war seit 10.8.2026
  # täglich rot (5/5), ohne dass es jemand erfuhr — genau die Fehlerklasse,
  # gegen die er selbst gebaut wurde (Kopf-Kommentar oben).
  issues: write

jobs:
  laeufe:
    name: Geplante Workflows — cancelled/skipped zählen als ROT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npx -y npm@11 ci
      - name: Lauf-Zustand der geplanten Workflows
        run: npm run check:ci-laeufe
        env:
          GH_TOKEN: ${{ github.token }}

      # ── Selbstheilung fehlender Required-Kontexte (K2/K11, 3.8.2026) ─────────
      # ZWEITE Wach-Ebene, andere Fehlerklasse als oben: dort scheitert ein Lauf
      # SICHTBAR (rot), hier findet gar keiner statt. Ein offener PR, an dessen
      # Head-SHA ein Required-Kontext nie gemeldet wurde, steht auf «expected» —
      # GitHub zeigt kein Rot, nichts scheitert, der PR ist nur für immer
      # blockiert. Belegte Fälle: PR #417 (Pfadfilter-Loch, K3 — die Ursache ist
      # mit dem ci.yml-Umbau weg) und die Bot-PRs aus fedlex-frische.yml, deren
      # Läufe mit `github.token` in `action_required` hängen bleiben (K1).
      #
      # Der Nachzug greift also NACH der Ursachenbehebung als Netz: er löst nicht
      # aus, wenn ein Kontext ROT ist (das ist ein Befund, kein Ausfall), sondern
      # nur, wenn er FEHLT.
      #
      # `workflow_dispatch` ist die dokumentierte Ausnahme von der GITHUB_TOKEN-
      # Rekursionssperre: von `github.token` erzeugte push/pull_request-Events
      # lösen keine Workflows aus, ein expliziter Dispatch dagegen schon. Genau
      # deshalb ist der Nachzug hier möglich und die Ursache dort nicht behebbar.
      #
      # `if: always()` — der Nachzug muss auch (und gerade) laufen, wenn der
      # Schritt darüber rot war.
      - name: Fehlende Required-Kontexte an offenen PRs nachziehen
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # Die Required-Kontexte kommen aus dem Branch-Schutz selbst — keine
          # zweite Liste im Repo (§5). Ist er nicht lesbar, wird das gemeldet
          # und der Schritt endet ohne Urteil (nie still).
          #
          # RICHTIGSTELLUNG zur Diagnose in Commit 9a57976fb (14.8.2026, «das
          # Skript stirbt unter bash -e am 403»): geprüft und WIDERLEGT. `gh api`
          # steht hier in der BEDINGUNG eines `if !`, und Bash-Fehlerabbruch
          # (`-e`, vom Runner via `bash -e {0}` gesetzt) klammert per Definition
          # jeden Befehl aus, der Teil einer if/while-Bedingung ist — der 403
          # führt darum planmässig zum `exit 0` in Zeile darunter, nicht zum
          # Absturz. Belegt an allen 5 roten Läufen 10.–14.8.2026 (jeder zeigt
          # exakt diese ::warning-Zeile, keiner einen Skript-Absturz an dieser
          # Stelle) UND lokal mit einem simulierten 403 unter `bash -e`
          # nachvollzogen. Die tägliche Rot-Serie stammt vom vorigen Schritt
          # («Lauf-Zustand der geplanten Workflows», meldet echt
          # `normen-monitor.yml: jüngster Lauf 'failure'`) — ein echter Befund,
          # kein Wächter-Bug.
          #
          # WAS DIE BRANCH-SCHUTZ-LESUNG LIEFERT UND OB DER NACHZUG OHNE SIE
          # KORREKT BLEIBT: sie liefert die Namen der Required-Kontexte, gegen
          # die unten geprüft wird, welche an offenen PRs fehlen. Ohne sie kann
          # dieser Schritt nicht wissen, WAS fehlen könnte — er überspringt den
          # Nachzug für diesen Lauf vollständig («kein Kontext-Nachzug, kein
          # Urteil»). Das bleibt KORREKT (kein falsches Urteil, keine
          # Fehlmeldung), ist aber UNVOLLSTÄNDIG: bleibt der 403 dauerhaft
          # bestehen, nachzieht dieser Schritt nie. Empirisch war das an allen
          # 5 geprüften Läufen der Fall — mit demselben, unveränderten
          # `permissions`-Block wie oben. Das deutet auf eine STRUKTURELLE
          # Grenze von `GITHUB_TOKEN` hin (die Branch-Schutz-Leseroute verlangt
          # Repository-Admin-Rechte, die `GITHUB_TOKEN` über keinen Eintrag im
          # `permissions:`-Block erhalten kann — anders als bei `actions:`,
          # `issues:` usw. gibt es keinen `administration:`-Schlüssel), nicht
          # auf eine vorübergehende Störung. Ein echter Fix bräuchte einen PAT
          # mit Admin-Leserecht (Secret, §18) oder eine andere Quelle für die
          # Required-Kontexte — beides ausserhalb dieses eng umrissenen Fixes;
          # offener Punkt für einen eigenen Roadmap-Schritt.
          if ! gh api "repos/${REPO}/branches/main/protection/required_status_checks" \
                 --jq '.contexts[]' > erwartet.txt 2>fehler.txt; then
            echo "::warning::Branch-Schutz nicht lesbar ($(head -1 fehler.txt)) — kein Kontext-Nachzug, kein Urteil."
            exit 0
          fi
          echo "Required-Kontexte laut Branch-Schutz:"; sed 's/^/  · /' erwartet.txt

          gh pr list --repo "$REPO" --state open --json number,headRefName,headRefOid \
            --jq '.[] | [.number, .headRefName, .headRefOid] | @tsv' > prs.tsv
          [ -s prs.tsv ] || { echo "Keine offenen PRs — nichts nachzuziehen."; exit 0; }

          while IFS=$'\t' read -r nr zweig sha; do
            [ -n "${sha:-}" ] || continue
            # Check-Runs (Actions) UND Commit-Statuses (Vercel & Co.) — beide
            # Mechanismen erfüllen einen Required-Kontext, also beide fragen.
            gh api --paginate "repos/${REPO}/commits/${sha}/check-runs" \
              --jq '.check_runs[].name' > gemeldet.txt 2>/dev/null || : > gemeldet.txt
            gh api --paginate "repos/${REPO}/commits/${sha}/status" \
              --jq '.statuses[].context' >> gemeldet.txt 2>/dev/null || true

            fehlend=$(grep -vxF -f gemeldet.txt erwartet.txt || true)
            if [ -z "$fehlend" ]; then
              echo "PR #${nr} (${zweig} @ ${sha:0:7}): alle Required-Kontexte gemeldet."
              continue
            fi
            echo "PR #${nr} (${zweig} @ ${sha:0:7}) — FEHLENDE Kontexte:"
            echo "$fehlend" | sed 's/^/    · /'
            # «Vercel» stammt aus der Vercel-App, nicht aus Actions — dafür gibt
            # es hier kein Mittel. Nur wenn ein ACTIONS-Kontext fehlt, hilft ein
            # Dispatch von ci.yml; alles andere wird benannt und stehen gelassen.
            if echo "$fehlend" | grep -qvxF 'Vercel'; then
              if gh workflow run ci.yml --repo "$REPO" --ref "$zweig"; then
                echo "  → ci.yml auf '${zweig}' nachgezogen (workflow_dispatch)."
              else
                echo "::warning::PR #${nr}: ci.yml-Dispatch auf '${zweig}' fehlgeschlagen — Kontexte bleiben offen."
              fi
            else
              echo "  → nur «Vercel» fehlt (App-Integration, kein Actions-Mittel) — nichts nachzuziehen."
            fi
          done < prs.tsv

      # ── Selbstmeldung (14.8.2026, Aktivierungs-Audit) ───────────────────────
      # Muster von normen-monitor.yml (dort seit A2/K5 bewährt): dieser
      # Workflow war der einzige geplante Wächter OHNE Issue-Eskalation — er
      # war seit 10.8.2026 täglich rot (5/5), und niemand erfuhr es. Genau die
      # Fehlerklasse «ein Ausfall, den niemand bemerkt» (Kopf-Kommentar oben),
      # nur diesmal am Melder selbst. `if: failure()`/`if: success()` sind die
      # eingebauten GitHub-Actions-Statusfunktionen: sie werten den Zustand
      # ALLER vorangehenden Schritte dieses Jobs aus (auch den `if: always()`-
      # Nachzug oben), nicht nur des unmittelbar vorigen.
      - name: Bei Rot — sichtbaren Aufgaben-Zettel anlegen/aktualisieren
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          offen=$(gh issue list --state open --search 'Wächter rot in:title' --json number --jq '.[0].number // empty')
          if [ -n "$offen" ]; then
            gh issue comment "$offen" --body "Weiterhin rot am $(date +%F). Lauf: ${RUN_URL}"
            echo "Zettel #${offen} kommentiert (weiterhin rot)."
          else
            nr=$(gh issue create \
              --title "🔴 Wächter rot seit $(date +%F) — geplante Läufe/PR-Kontexte prüfen" \
              --body "Der tägliche Wächter (geplante Läufe, .github/workflows/waechter.yml) ist fehlgeschlagen — mindestens ein geplanter Workflow ist laut \`check:ci-laeufe\` nicht in Ordnung, ODER der PR-Kontext-Nachzug (K2/K11) ist an einer anderen Stelle als der bekannten, tolerierten Branch-Schutz-403-Lücke gescheitert. Lauf-Log prüfen. Lauf: ${RUN_URL}" \
              | grep -oE '[0-9]+$')
            echo "Zettel #${nr} angelegt (erstmals rot)."
          fi

      - name: Bei Grün — offenen Aufgaben-Zettel schliessen
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          offen=$(gh issue list --state open --search 'Wächter rot in:title' --json number --jq '.[0].number // empty')
          if [ -z "$offen" ]; then
            echo "Wächter grün, kein offener Zettel — nichts zu schliessen."
            exit 0
          fi
          gh issue close "$offen" --reason completed --comment "🟢 Wächter wieder grün am $(date +%F). Lauf: ${RUN_URL}"
          echo "Zettel #${offen} geschlossen (Wächter grün)."
