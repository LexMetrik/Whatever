# Befund 4d Werkzeug-Analyse 14.8.2026 (offener Punkt A1, BACKLOG-AUDIT-WERKZEUGE-2026-07):
# Abhängigkeits-PRs klein gehalten. Landung (Skill landung §«Prüfstrasse seit
# 8.9.2026», Nachzug-Zwang entfallen 19.9.2026 mit der Merge-Queue): die
# landende Session reiht Patch/Minor per `gh pr merge --squash` in die
# Merge-Queue ein; Hauptversionen werden mit Begründung geschlossen.
version: 2
updates:
  # Entscheid David 8.9.2026 (QS-CI-MINUTEN M2): monatlich statt wöchentlich und
  # KEIN automatisches Rebase — Messung 8.9.2026: 13 Zweige lösten 113 CI-Läufe
  # (4 487 min/30 Tage) aus, weil Dependabot bei jeder Landung auf main rebasierte.
  # Nachziehen ist seit dem Org-Umzug (19.9.2026) nicht mehr nötig: die
  # Merge-Queue auf main baut den PR gegen den aktuellen main und zieht den
  # Zweig selbst nach — die landende Session reiht nur noch ein.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    rebase-strategy: disabled
    groups:
      # Browser-Testkette isoliert (Lehre 15.8.2026, PR #510): ein 19-Paket-
      # Sammel-Bump mit @playwright/test 1.60→1.62 + @vitejs/plugin-react
      # liess 3 Shards rot werden — im Sammelpaket unattributierbar. Diese
      # Kette landet nur noch allein, damit ein Timing-/Locator-Effekt
      # eindeutig zuordenbar ist.
      browser-tests:
        dependency-type: development
        patterns: ["@playwright/*", "playwright", "@axe-core/*", "@vitejs/plugin-react"]
        update-types: [minor, patch]
      dev-minor:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns: ["@playwright/*", "playwright", "@axe-core/*", "@vitejs/plugin-react"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    rebase-strategy: disabled
    open-pull-requests-limit: 2
